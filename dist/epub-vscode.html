  .lib-drop strong { font-size: 15px; font-weight: 500; }
  .lib-drop span { color: var(--lib-fg3); font-size: 13px; }
  /* 视觉隐藏而非 display:none —— 后者在 Safari 下可能导致 file input 不派发 change */

  }
  .lib-drop:focus-visible { outline: 2px solid var(--lib-accent); outline-offset: 2px; }
  .lib-status { min-height: 22px; margin-top: 12px; font-size: 13px; color: var(--lib-fg2); }
  .lib-status.err { color: var(--lib-err); }

    font-size: 11px; line-height: 1.5; overflow: auto; max-height: 160px; color: #d7a7a7;
  }
  .lib-diag-wrap { margin-top: 18px; }
  .lib-diag-btn {
    border: 0; background: transparent; color: var(--lib-fg3); cursor: pointer;
    font-size: 12px; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px;

  .lib-title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-meta { font-size: 12px; color: var(--lib-fg3); }
  .lib-open {
    border: 0; background: var(--lib-accent); color: #fff; padding: 5px 12px;

            return;

          say?.(`解析出 ${book.pages} 页、${book.chapters.length} 章`);
          adapter = createPdfAdapter(book);
        } else {
          const files = await unzip(buffer);
          say?.(`解包出 ${files.size} 个文件，正在解析目录…`);
          adapter = createEpubAdapter(files);
        }

        // File 菜单里的「最近打开」

        const source = createBookSource({
          adapter,
          size,
          recentBooks,
          onOpenLibrary: () => renderLibrary(),
          onPickFile: () => pickEpubFile(say),
          onOpenBook: async (bookIdToOpen) => {
            const b = await getBookBlob(bookIdToOpen);
            if (!b) {
              say?.("书库里找不到这本书的内容，请重新拖入。", true);
              return;
            }
            openWorkspace(await b.arrayBuffer(), b.size, say);
          },
        });

        // 首次打开时入库（含原始 blob，方便下次直接读）
        if (blob) {
          const bk = source._book;
          await putBook({
            id: bookId(bk.title, size),
            title: bk.title,
            author: bk.author,
            size,
            blob,
          }).catch((err) => console.warn("[epub] 入库失败（不影响阅读）", err));
        }

        // 换书：先把上一本的外壳彻底拆掉，否则 mount 会发现已有外壳而不挂载新的，
        // 页面就一直停在上一本书
        teardownWorkspace();

        const lib = document.getElementById("library");
        if (lib) {
          lib.hidden = true;
          lib.innerHTML = "";
        }
        document.title = `${source.workspaceName()} — EPUB Workspace`;
        currentShell = createShell(source).mount();
      } catch (err) {
        console.error("[epub] 打开失败", err);
        const msg = err instanceof Error ? err.message : String(err);
        if (say) say(`打开失败：${msg}`, true);
        // 书库页可能已经被清空了，这时 say 写到哪都看不见，再兜一层
        if (!document.querySelector(".vsc-app")) {
          await renderLibrary().catch(() => {});
          fatal(`打开失败：${msg}`, err instanceof Error ? err.stack : "");
        }
      }
    }

    function fmtSize(n) {
      const mb = (Number(n) || 0) / 1024 / 1024;
      return mb >= 1 ? `${mb.toFixed(1)} MB` : `${Math.round((Number(n) || 0) / 1024)} KB`;
    }

    /* ------------------------------ 启动 ------------------------------ */

    // ⌘/Ctrl + O：随时添加一本新书
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "o") {
        e.preventDefault();
        pickEpubFile();
      }
    });

    // 任何没被接住的错误都显示到页面上，而不是只留在 console 里
    window.addEventListener("error", (e) => {
      fatal(e.message || "脚本错误", e.error?.stack || "");
    });
    window.addEventListener("unhandledrejection", (e) => {
      const r = e.reason;
      fatal(r?.message || String(r) || "未处理的异步错误", r?.stack || "");
    });

    envProblems = checkEnv();
    if (envProblems.length) console.warn("[epub] 环境自检", envProblems);

    applyStyles();
    renderLibrary().catch((err) => fatal("书库页渲染失败", err?.stack || String(err)));

  return {};

        root.style.setProperty("--vsc-code-line", `${Math.round(next * 1.38)}px`);
        root.style.setProperty("--vsc-gutter-w", `${Math.max(36, Math.round(next * 4.3))}px`);
        const chip = app?.querySelector(".vsc-font-chip");
        if (chip) chip.textContent = `${next}px`;
        notifyResize();
      }

      /** 按档位表前后挪一档 */
      function stepFontSize(dir) {
        const cur = codeSize();
        let idx = FONT_SIZES.indexOf(cur);
        if (idx < 0) {
          // 存的是档位表外的值，找最接近的
          idx = FONT_SIZES.reduce((best, v, i) =>
            Math.abs(v - cur) < Math.abs(FONT_SIZES[best] - cur) ? i : best, 0);
        }
        const next = FONT_SIZES[Math.min(FONT_SIZES.length - 1, Math.max(0, idx + dir))];
        if (next !== cur) setFontSize(next);
      }

      /* ------------------------------ 骨架 ------------------------------ */

      function mount(host = document.body) {
        // 之前这里是「已有外壳就直接 return」，结果换书时新外壳根本没挂上，
        // 页面还停在上一本书。现在兜底把残留的外壳拆掉。
        const stale = document.querySelector(".vsc-app");
        if (stale) {
          console.warn("[shell] 挂载前发现残留外壳，已移除；调用方应先 destroy()");
          stale.remove();
        }
        app = document.createElement("div");
        app.className = "vsc-app";
        app.innerHTML = `
          <div class="vsc-titlebar">

              <button type="button" class="vsc-icon-btn vsc-palette-btn" title="命令面板（⌘/Ctrl + P）">${ico('<path d="M15 6V4.5a2.5 2.5 0 1 1 2.5 2.5H15zm0 0v12m0-12H9m6 12v1.5a2.5 2.5 0 1 0 2.5-2.5H15zm0 0H9m0 0v1.5A2.5 2.5 0 1 1 6.5 15H9zm0 0V6m0 0V4.5A2.5 2.5 0 1 0 6.5 7H9z"/>')}</button>
              <button type="button" class="vsc-icon-btn vsc-agent-btn" title="Agent 面板（⌘/Ctrl + I）">${ico('<path d="M11 3.5 12.6 8l4.4 1.6-4.4 1.6L11 15.6 9.4 11.2 5 9.6 9.4 8z"/><path d="m18 14.5.75 2 2 .75-2 .75-.75 2-.75-2-2-.75 2-.75z"/>')}</button>
            </div>
          </div>
          <nav class="vsc-activity">
            <button type="button" class="vsc-act-btn active" data-act="explorer" title="Explorer">${ico('<path d="M4 6h6l2 2h8v10H4z"/>')}</button>
            <button type="button" class="vsc-act-btn" data-act="search" title="Search">${ico('<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>')}</button>
            <button type="button" class="vsc-act-btn" data-act="scm" title="Source Control">${ico('<circle cx="6" cy="6" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="12" cy="18" r="2.2"/><path d="M6 8v4a6 6 0 0 0 6 6M18 8v2"/>')}</button>

            <div class="vsc-act-spacer"></div>
            <button type="button" class="vsc-act-btn vsc-agent-act" title="Agent（⌘/Ctrl + I）">${ico('<path d="M4 5h16v11H7l-3 3z"/><circle cx="9.5" cy="10.5" r="1"/><circle cx="14.5" cy="10.5" r="1"/>')}</button>
          </nav>
          <aside class="vsc-sidebar">

          </aside>
          <footer class="vsc-status">
            <span class="vsc-branch">⎇ main</span>
            <span class="vsc-sync">0↓ 0↑</span>

              <span class="vsc-ln">Ln 1, Col 1</span>
              <span>UTF-8</span>
              <span>LF</span>

              <span class="vsc-theme-chip" title="切换 Light+ / Dark+">Dark+</span>

        host.appendChild(app);

        bind();
        applyTheme(currentTheme());
        renderMenubar();
        setFontSize(codeSize());
        setPanelOpen(state.panelOpen);
        setAgentSpeed(state.agentSpeed);
        setAgentOpen(state.agentOpen);
        refresh();

        // 先把列数量出来，再交给数据源。否则 onReady 里恢复进度打开的第一章
        // 会用默认宽度渲染一遍，随后又被 onResize 重渲染一遍。
        lastCols = measureCols();

        source.onReady?.(api);

        // 自定义字体加载完成后宽度会变（fallback 字体字宽不同），重量一次
        document.fonts?.ready?.then(() => notifyResize()).catch(() => {});
        return api;
      }

      /* ------------------------------ 事件 ------------------------------ */

      /**
       * 行内动作的统一委托：任何带 data-action 的元素被点击时交给 source 处理，
       * 并阻止冒泡，免得同一次点击又触发了外层的「打开文件」。
       * 树、面板、编辑器三处都走这个入口，数据源不必自己到处挂监听。
       * @returns {boolean} 是否已消费掉这次点击
       */
      function handleAction(e) {
        const el = /** @type {HTMLElement} */ (e.target).closest("[data-action]");
        if (!el) return false;
        e.preventDefault();
        e.stopPropagation();
        source.onAction?.(el.dataset.action || "", { ...el.dataset }, el);
        return true;
      }

      function bind() {
        app.querySelectorAll(".vsc-act-btn[data-act]").forEach((btn) => {
          btn.addEventListener("click", () => {
            app.querySelectorAll(".vsc-act-btn[data-act]").forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            state.activity = /** @type {HTMLElement} */ (btn).dataset.act || "explorer";
            renderSidebar();
          });
        });

        $(".vsc-theme-btn").addEventListener("click", toggleTheme);
        $(".vsc-font-chip").addEventListener("click", () => setFontSize(DEFAULT_FONT));
        $(".vsc-theme-chip").addEventListener("click", toggleTheme);
        $(".vsc-palette-btn").addEventListener("click", () => openPalette(""));

        $(".vsc-side-search").addEventListener("input", (e) => {
          state.filter = /** @type {HTMLInputElement} */ (e.target).value.trim();
          renderSidebar();
        });

        $(".vsc-tree").addEventListener("click", (e) => {
          if (handleAction(e)) return;
          const row = /** @type {HTMLElement} */ (e.target).closest(".vsc-tree-row");
          if (!row) return;
          const el = /** @type {HTMLElement} */ (row);
          if (el.dataset.folder) {
            const key = el.dataset.folder;
            state.openFolders[key] = state.openFolders[key] === false;
            renderSidebar();
            return;
          }
          if (el.dataset.id) openFile(el.dataset.id);
        });

        $(".vsc-tabs").addEventListener("click", (e) => {
          const target = /** @type {HTMLElement} */ (e.target);
          const tab = target.closest(".vsc-tab");
          if (!tab) return;
          const id = /** @type {HTMLElement} */ (tab).dataset.tab || "";
          if (target.closest(".x")) {
            e.stopPropagation();
            closeTab(id);
            return;
          }
          activateTab(id);
        });

        app.querySelectorAll(".vsc-panel-tabs button[data-panel]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.panel = /** @type {HTMLElement} */ (btn).dataset.panel || "terminal";
            lsSet(PANEL_KEY, state.panel);
            if (!state.panelOpen) {
              setPanelOpen(true);
              return;
            }
            renderPanel();
          });
        });

        const panelTabs = $(".vsc-panel-tabs");
        $(".vsc-panel-toggle").addEventListener("click", togglePanel);
        panelTabs.addEventListener("dblclick", (e) => {
          if (/** @type {HTMLElement} */ (e.target).closest("button")) return;
          togglePanel();
        });

        // 命令行（面板底部输入）
        const form = /** @type {HTMLFormElement} */ ($(".vsc-reply-form"));
        const cmdInput = /** @type {HTMLInputElement} */ (form.querySelector("input"));
        if (source.commandLine) {
          cmdInput.placeholder = source.commandLine.placeholder;
        } else {
          form.style.display = "none";
        }
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const val = cmdInput.value.trim();
          if (!val) return;
          cmdInput.value = "";
          if (val.startsWith(">")) {
            openPalette(val.slice(1).trim());
            return;
          }
          source.commandLine?.submit(val);
        });

        // 命令面板
        const pal = $(".vsc-palette");
        /** @type {HTMLInputElement} */ (pal.querySelector("input"))
          .addEventListener("input", (e) => fillPalette(/** @type {HTMLInputElement} */ (e.target).value));
        pal.querySelector(".vsc-palette-list").addEventListener("click", (e) => {
          const row = /** @type {HTMLElement} */ (e.target).closest("[data-idx]");
          if (!row) return;
          const idx = Number(/** @type {HTMLElement} */ (row).dataset.idx);
          pal.classList.remove("open");
          paletteItems[idx]?.run();
        });

        on(document, "keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "p") {
            e.preventDefault();
            openPalette("");
          }
          if ((e.metaKey || e.ctrlKey) && e.key === "`") {
            e.preventDefault();
            togglePanel();
          }
          // Agent 面板：⌘/Ctrl + I 开关（Cursor 的 Toggle Agents）
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "i") {
            e.preventDefault();
            toggleAgent();
            return;
          }
          // 面板开着且焦点不在输入框里时，回车 = 继续下一段
          if (
            e.key === "Enter" && state.agentOpen && !e.metaKey && !e.ctrlKey && !e.altKey &&
            !/^(INPUT|TEXTAREA)$/.test(/** @type {HTMLElement} */ (e.target)?.tagName || "")
          ) {
            e.preventDefault();
            agent.advance();
            return;
          }
          // 字号：⌘/Ctrl + 加号 / 减号 / 0，与 VS Code 一致
          if (e.metaKey || e.ctrlKey) {
            if (e.key === "=" || e.key === "+") {
              e.preventDefault();
              stepFontSize(1);
            } else if (e.key === "-" || e.key === "_") {
              e.preventDefault();
              stepFontSize(-1);
            } else if (e.key === "0") {
              e.preventDefault();
              setFontSize(DEFAULT_FONT);
            }
          }
          if (e.key === "Escape") {
            pal.classList.remove("open");
            closeMenu();
            hideImgPop();
          }
        });

        // 面板与编辑器里的行内动作（删书签、切风格、打开书库等）
        $(".vsc-panel-body").addEventListener("click", handleAction);
        $(".vsc-editor").addEventListener("click", handleAction);

        bindMenubar();
        bindImgPop();
        bindResizers();

        on(window, "resize", notifyResize);
        bindScroll();
        bindAgent();
      }

      function bindAgent() {
        $(".vsc-agent-x").addEventListener("click", () => setAgentOpen(false));
        $(".vsc-agent-btn").addEventListener("click", toggleAgent);
        $(".vsc-agent-act").addEventListener("click", toggleAgent);
        $(".vsc-agent-speed").addEventListener("click", cycleAgentSpeed);

        $(".vsc-agent-foot").addEventListener("click", (e) => {
          const btn = /** @type {HTMLElement} */ (e.target).closest("[data-agent]");
          if (!btn) return;
          const act = /** @type {HTMLElement} */ (btn).dataset.agent;
          if (act === "next") agent.advance();
          else if (act === "auto") agent.toggleAuto();
        });

        // Agent 面板里的图片同样要能 hover 预览
        const pop = $(".vsc-img-pop");
        const img = /** @type {HTMLImageElement} */ (pop.querySelector("img"));
        $(".vsc-agent-body").addEventListener("mouseover", (e) => {
          const em = /** @type {HTMLElement} */ (e.target).closest(".vsc-img-emoji");
          const src = em?.getAttribute("data-src");
          if (!src) return;
          img.src = src;
          pop.classList.add("show");
          const r = em.getBoundingClientRect();
          let left = r.left - 512;
          if (left < 8) left = 8;
          pop.style.left = `${left}px`;
          pop.style.top = `${Math.max(8, Math.min(r.top - 20, window.innerHeight - 340))}px`;
        });
        $(".vsc-agent-body").addEventListener("mouseout", (e) => {
          if (!/** @type {HTMLElement} */ (e.relatedTarget)?.closest?.(".vsc-img-emoji")) hideImgPop();
        });

        // 面板宽度拖拽
        const handle = $(".vsc-agent-resizer");
        handle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const startX = e.clientX;
          const startW = Number(lsGet(AGENT_W_KEY, 340)) || 340;
          app.classList.add("agent-resizing");
          const move = (ev) => {
            // 面板在右侧，往左拖变宽
            const w = Math.min(AGENT_W_MAX, Math.max(AGENT_W_MIN, startW + (startX - ev.clientX)));
            document.documentElement.style.setProperty("--vsc-agent-w", `${w}px`);
            lsSet(AGENT_W_KEY, String(Math.round(w)));
          };
          const up = () => {
            app.classList.remove("agent-resizing");
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
            notifyResize();
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });
      }

      function bindImgPop() {
        const editor = $(".vsc-editor");
        const pop = $(".vsc-img-pop");
        const img = /** @type {HTMLImageElement} */ (pop.querySelector("img"));

        editor.addEventListener("mouseover", (e) => {
          const em = /** @type {HTMLElement} */ (e.target).closest(".vsc-img-emoji");
          if (!em) return;
          const src = em.getAttribute("data-src");
          if (!src) return;
          img.src = src;
          pop.classList.add("show");
          const r = em.getBoundingClientRect();
          let left = r.right + 12;
          let top = r.top - 20;
          if (left + 500 > window.innerWidth) left = r.left - 512;
          if (top + 320 > window.innerHeight) top = window.innerHeight - 340;
          if (top < 8) top = 8;
          pop.style.left = `${Math.max(8, left)}px`;
          pop.style.top = `${top}px`;
        });
        editor.addEventListener("mouseout", (e) => {
          if (!/** @type {HTMLElement} */ (e.relatedTarget)?.closest?.(".vsc-img-emoji")) hideImgPop();
        });
      }

      function hideImgPop() {
        app?.querySelector(".vsc-img-pop")?.classList.remove("show");
      }

      /* ---------------------- 编辑器可用宽度测量 ---------------------- */

      /**
       * 量出编辑器当前能放下多少列等宽字符。
       * 用一个隐藏探针实测字符宽度，而不是按字号估算——字体回退、缩放、
       * 用户改过字号都会让估算失准。
       * @returns {number} 列数；量不出来（还没布局）返回 0
       */
      function measureCols() {
        if (!alive()) return 0;
        const ed = app?.querySelector(".vsc-editor");
        if (!ed || !ed.clientWidth) return 0;

        let probe = ed.querySelector(".vsc-measure");
        if (!probe) {
          probe = document.createElement("span");
          probe.className = "vsc-measure";
          ed.appendChild(probe);
        }
        // 量 100 个字符再平均，抵消亚像素误差
        probe.textContent = "0".repeat(100);
        const charW = probe.getBoundingClientRect().width / 100;
        if (!charW) return 0;

        // 行号列宽度随字号变，从 CSS 变量读，别写死
        const gutterVar = getComputedStyle(document.documentElement).getPropertyValue("--vsc-gutter-w");
        const GUTTER = parseFloat(gutterVar) || gutterW();
        const PAD_RIGHT = 20;
        const SAFETY = 2;   // 留一点余量，避免正好压线触发横向滚动
        const avail = ed.clientWidth - GUTTER - PAD_RIGHT - SAFETY;
        return Math.max(20, Math.floor(avail / charW));
      }

      /** 可用列数变化时通知数据源（窗口缩放、侧栏拖动都会触发） */
      let lastCols = 0;
      let resizeTimer = null;
      function notifyResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const cols = measureCols();
          if (!cols || cols === lastCols) return;
          lastCols = cols;
          source.onResize?.(cols);
        }, 160);
      }

      function bindResizers() {
        // 侧边栏宽度
        const sideHandle = $(".vsc-side-resizer");
        sideHandle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const start = e.clientX;
          const startW = Number(lsGet(SIDEBAR_KEY, 260)) || 260;
          const move = (ev) => {
            const w = Math.min(460, Math.max(180, startW + (ev.clientX - start)));
            document.documentElement.style.setProperty("--vsc-side-w", `${w}px`);
            lsSet(SIDEBAR_KEY, String(Math.round(w)));
            notifyResize();   // 侧栏变宽 = 编辑器变窄，列数要跟着变
          };
          const up = () => {
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });

        // 面板高度
        const panelHandle = $(".vsc-panel-resizer");
        const panelEl = $(".vsc-panel");
        const workEl = $(".vsc-work");
        panelHandle.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          const startY = e.clientY;
          const startH = panelEl.getBoundingClientRect().height;
          const maxH = Math.max(PANEL_H_MIN, workEl.clientHeight - PANEL_H_KEEP);
          app.classList.add("panel-resizing");
          try { panelHandle.setPointerCapture(e.pointerId); } catch { /* ignore */ }
          const move = (ev) => {
            const h = Math.min(maxH, Math.max(PANEL_H_MIN, startH + (startY - ev.clientY)));
            document.documentElement.style.setProperty("--vsc-panel-h", `${Math.round(h)}px`);
          };
          const up = () => {
            app.classList.remove("panel-resizing");
            const h = Math.round(panelEl.getBoundingClientRect().height);
            if (h >= PANEL_H_MIN) lsSet(PANEL_H_KEY, String(h));
            panelHandle.removeEventListener("pointermove", move);
            window.removeEventListener("pointermove", move);
            window.removeEventListener("pointerup", up);
          };
          panelHandle.addEventListener("pointermove", move);
          window.addEventListener("pointermove", move);
          window.addEventListener("pointerup", up);
        });
        panelHandle.addEventListener("dblclick", () => {
          document.documentElement.style.removeProperty("--vsc-panel-h");
          lsDel(PANEL_H_KEY);
        });
      }

      /* --------------------------- 面板折叠 --------------------------- */

      function setPanelOpen(open) {
        state.panelOpen = !!open;
        lsSet(PANEL_OPEN_KEY, state.panelOpen ? "1" : "0");
        app.classList.toggle("panel-off", !state.panelOpen);
        const btn = $(".vsc-panel-toggle");
        btn.textContent = state.panelOpen ? "⌄" : "⌃";
        btn.title = state.panelOpen ? "折叠面板（Ctrl/⌘ + `）" : "展开面板（Ctrl/⌘ + `）";
        btn.setAttribute("aria-expanded", state.panelOpen ? "true" : "false");
        if (state.panelOpen) renderPanel();
      }

      function togglePanel() {
        setPanelOpen(!state.panelOpen);
      }

      /* --------------------------- 命令面板 --------------------------- */

      let paletteItems = /** @type {{label: string, hint?: string, run: () => void}[]} */ ([]);

      function openPalette(q) {
        const pal = $(".vsc-palette");
        pal.classList.add("open");
        const input = /** @type {HTMLInputElement} */ (pal.querySelector("input"));
        input.value = q || "";
        input.focus();
        fillPalette(input.value);
      }

      function fillPalette(q) {
        const list = $(".vsc-palette-list");
        const query = String(q || "").trim().toLowerCase();
        paletteItems = source.commands().filter((c) =>
          !query || c.label.toLowerCase().includes(query) || (c.hint || "").toLowerCase().includes(query)
        ).slice(0, 40);
        list.innerHTML = paletteItems.length
          ? paletteItems.map((c, i) =>
              `<div class="vsc-palette-row" data-idx="${i}">
                <span>${escapeHtml(c.label)}</span>
                <span class="hint">${escapeHtml(c.hint || "")}</span>
              </div>`

        return { rows: [{ type: "comment", text: `# --- ${who}${lang} ---` }, ...code, { type: "comment", text: "# --- end ---" }] };
      }
      return { rows: [{ type: "comment", text: `/* ${who}${lang}` }, ...code, { type: "comment", text: "*/" }] };

      return [...joined.matchAll(/⟦IMG:(\d+)⟧/g)].map((m) => {
        const img = images[Number(m[1])];
        if (!img) return null;
        const emoji = IMG_EMOJI[Math.abs(hashStr(img.src)) % IMG_EMOJI.length];
        return { emoji, src: img.src, alt: img.alt };

      const lines = [];
      raw.forEach((chunk) => {
        String(chunk || "")
          .split(/\n|(?=@\S+#\d+\s)/)
          .map((s) => s.replace(/⟦IMG:\d+⟧/g, " ").replace(/[ \t]+/g, " ").trimEnd())
          .forEach((line) => {

      if (!linesText.length) return { lines: [], images: imgMarks };

      if (multi) {

          };

      }

      const clean = linesText[0];
      const roll = rand();
      if (cs.line && roll < 0.22 && clean.length < 48) {
        return { lines: [], images: imgMarks, inline: ` ${cs.line}${clean}` };
      }
      if (roll < 0.5 || !cs.line) return { lines: [cs.single(clean)], images: imgMarks };

      let s = escapeHtml(text);
      // 先保护字符串字面量（escapeHtml 后引号是 &quot; / &#39;），
      // 避免字符串里的 //、#、关键字、数字被误高亮
      const strs = [];
      s = s.replace(/(&quot;.*?&quot;|&#39;.*?&#39;|`[^`]*`)/g, (m) => {
        strs.push(m);
        return `\u0001S${strs.length - 1}S\u0001`;
      });
      const restore = (x) => x.replace(/\u0001S(\d+)S\u0001/g, (_, i) => `<span class="vsc-str">${strs[Number(i)]}</span>`);
      s = s.replace(/(\/\/.*)$/g, '<span class="vsc-cm">$1</span>');
      s = s.replace(/^(\s*)(#(?![\w[!]).*)$/g, '$1<span class="vsc-cm">$2</span>');
      s = s.replace(/(\s)(#(?![\w[!]).*)$/g, '$1<span class="vsc-cm">$2</span>');
      s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="vsc-cm">$1</span>');
      s = s.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="vsc-cm">$1</span>');
      if (s.includes('class="vsc-cm"')) return restore(s);
      s = s.replace(new RegExp(`\\b(${HIGHLIGHT_KEYWORDS})\\b`, "g"), '<span class="vsc-kw">$1</span>');
      s = s.replace(/\b(\d+)\b/g, '<span class="vsc-num">$1</span>');
      s = s.replace(/\b([A-Za-z_][\w]*)\s*(?=\()/g, '<span class="vsc-fn">$1</span>');
      s = s.replace(/(&lt;\/?)([\w-]+)/g, '<span class="vsc-punc">$1</span><span class="vsc-tag">$2</span>');

    }

    function renderLine(row) {
      const imgs = row.images || [];
      const emojiHtml = imgs.map((img) =>
        `<span class="vsc-img-emoji" data-src="${escapeHtml(img.src)}" title="${escapeHtml(img.alt || "")}">${img.emoji}</span>`
      ).join(" ");
      const body = (row.type === "comment" || row.fence)
        ? `<span class="vsc-cm">${escapeHtml(row.text)}</span>`
        : highlightCode(row.text);
      if (!emojiHtml) return body || " ";
      if (!row.text || row.text === "// media") {
        return `<span class="vsc-cm">// assets </span>${emojiHtml}`;

    // V2EX 专属：把一条回复渲染成带 @用户#楼层 头的注释块
    function replyBlockWrap(reply, cstyle, images) {
      const cs = COMMENT_STYLE[cstyle] || COMMENT_STYLE.slash;
      const header = `@${reply.user}#${reply.floor}`;
      const open = cstyle === "html" ? `<!-- ${header}` : cstyle === "hash" ? `# ${header}` : `/* ${header}`;
      const close = cstyle === "html" ? "-->" : cstyle === "hash" ? "# ──────────" : " */";
      const rows = [{ type: "comment", text: open }];

      reply.parts.forEach((part) => {
        if (part.kind === "fence") {
          const lang = part.lang || "code";
          const src = (part.lines || [""]).map((l) => l.replace(/\t/g, "  "));
          rows.push({ type: "comment", text: `${cs.mid}\`\`\`${lang}` });
          src.forEach((l) => rows.push({ type: "code", text: l || " ", fence: true }));
          rows.push({ type: "comment", text: `${cs.mid}\`\`\``.trimEnd() });
          return;
        }
        const lines = String(part.value || "").split("\n");
        lines.forEach((line) => {
          rows.push({ type: "comment", text: line ? `${cs.mid}${line}` : cs.mid.trimEnd() });
        });
      });

      const imgMarks = extractCommentImages(
        reply.parts.filter((p) => p.kind === "text").map((p) => p.value || ""),
        images
      );
      rows.push({ type: "comment", text: close, images: imgMarks });
      return { rows };
    }

  "src/shell/agent.js": function (__require) {
    /**
     * Agent 面板：把内容伪装成 AI Agent 的逐步输出（Cursor 风格）。
     *
     * 数据源无关——它只认一个 step 列表，每步是「一次工具调用 + 一段正文」。
     * EPUB 版喂章节段落，将来 V2EX 版可以喂楼层回复。
     *
     * 交互模型刻意做成「一步一停」：吐完一段就等确认，
     * 这样它既是伪装，也是一种真的阅读节奏控制。
     *
     * @typedef {Object} AgentStep
     * @property {string} tool          工具名，如 "Read" / "Edit"
     * @property {string} path          目标路径
     * @property {string} [range]       行范围，如 "L12-28"
     * @property {string} text          这一步要吐出的正文
     * @property {{emoji: string, src: string, alt: string}[]} [images]
     * @property {number} [para]        对应的正文段落序号（用于联动编辑器）
     */

    const { escapeHtml } = __require("src/shell/util.js");
    /** 打字速度档位（毫秒/帧，每帧吐若干字符） */
    const SPEEDS = [
      { id: "slow", label: "慢", cps: 28 },
      { id: "normal", label: "正常", cps: 70 },
      { id: "fast", label: "快", cps: 160 },
      { id: "instant", label: "瞬间", cps: 0 },
    ];

    const DEFAULT_SPEED = "normal";

    function speedOf(id) {
      return SPEEDS.find((s) => s.id === id) || SPEEDS.find((s) => s.id === DEFAULT_SPEED);
    }

    /**
     * @param {Object} deps
     * @param {() => HTMLElement | null} deps.bodyEl     消息区容器
     * @param {() => HTMLElement | null} deps.footEl     底部操作条
     * @param {() => string} deps.speedId
     * @param {(step: AgentStep, index: number) => void} [deps.onStep]   每步开始时回调（用于联动编辑器）
     * @param {() => void} [deps.onDone]
     */
    function createAgentRunner({ bodyEl, footEl, speedId, onStep, onDone }) {
      /** @type {AgentStep[]} */
      let steps = [];
      let index = -1;          // 当前已开始的步序号
      let typing = false;      // 是否正在打字
      let auto = false;        // 连续模式
      let timer = null;
      let header = "";         // 用户那条「指令」

      function clearTimer() {
        if (timer) {
          clearInterval(timer);
          clearTimeout(timer);
          timer = null;
        }
      }

      /** 恢复历史时最多实际渲染几段，更早的折成一行——否则读到第 200 段时要铺 200 个 DOM 块 */
      const KEEP_HISTORY = 6;

      /**
       * 载入一批步骤。
       * @param {AgentStep[]} nextSteps
       * @param {string} headerText
       * @param {number} [startIndex] 已经"输出过"到第几步（用于接上阅读进度）。
       *                              -1 或省略表示从头开始。
       */
      function load(nextSteps, headerText, startIndex = -1) {
        clearTimer();
        steps = Array.isArray(nextSteps) ? nextSteps : [];
        index = -1;
        typing = false;
        auto = false;
        header = headerText || "";
        const body = bodyEl();
        if (body) {
          body.innerHTML = header
            ? `<div class="vsc-agent-user">${escapeHtml(header)}</div>`
            : "";
        }

        // 接上阅读进度：把此前的段落直接补出来（不打字），让面板看起来"已经输出到这里"
        const start = Math.min(steps.length - 1, Math.floor(Number(startIndex)));
        if (start >= 0) {
          const from = Math.max(0, start - KEEP_HISTORY + 1);
          if (from > 0 && body) {
            const skip = document.createElement("div");
            skip.className = "vsc-agent-skip";
            skip.textContent = `⋯ 前 ${from} 段已输出`;
            body.appendChild(skip);
          }
          for (let i = from; i <= start; i++) {
            index = i;
            appendStep(steps[i], true);
          }
          index = start;
        }
        renderFoot();
      }

      /** 跳到第 n 步（跳过的步骤直接补全文本，不打字） */
      function seek(n) {
        const target = Math.max(0, Math.min(steps.length - 1, n));
        if (target <= index) return;
        while (index < target - 1) {
          index += 1;
          appendStep(steps[index], true);
        }
        next();
      }

      /** 当前这一步对应的段落序号（供外部保存进度） */
      function currentStep() {
        return steps[index] || null;
      }

      /** 推进一步 */
      function next() {
        if (typing || index >= steps.length - 1) return;
        index += 1;
        const step = steps[index];
        onStep?.(step, index);
        appendStep(step, false);
      }

      /**
       * 渲染一步。
       * @param {AgentStep} step
       * @param {boolean} instant 直接出全文，不打字
       */
      function appendStep(step, instant) {
        const body = bodyEl();
        if (!body) return;

        const tool = document.createElement("div");
        tool.className = "vsc-agent-tool running";
        tool.innerHTML =
          `<span class="dot">⏺</span>` +
          `<span class="name">${escapeHtml(step.tool || "Read")}</span>` +
          `<span class="path">${escapeHtml(step.path || "")}</span>` +
          (step.range ? `<span class="range">${escapeHtml(step.range)}</span>` : "");
        body.appendChild(tool);

        const text = document.createElement("div");
        text.className = "vsc-agent-text";
        body.appendChild(text);

        const imgHtml = (step.images || []).map((img) =>
          `<span class="vsc-img-emoji" data-src="${escapeHtml(img.src)}" title="${escapeHtml(img.alt || "")}">${img.emoji}</span>`
        ).join(" ");

        const full = String(step.text || "");
        const cps = speedOf(speedId()).cps;

        const finish = () => {
          tool.classList.remove("running");
          text.innerHTML = escapeHtml(full) + (imgHtml ? ` ${imgHtml}` : "");
          typing = false;
          scrollToEnd();
          renderFoot();
          if (auto && index < steps.length - 1) {
            timer = setTimeout(() => next(), 450);
          } else if (index >= steps.length - 1) {
            onDone?.();
          }
        };

        if (instant || !cps || !full) {
          finish();
          return;
        }

        // 打字机：按帧吐字符，长文也不会卡（每帧字符数随速度走）
        typing = true;
        renderFoot();
        let i = 0;
        const FRAME = 24;                                   // ms
        const perFrame = Math.max(1, Math.round(cps * FRAME / 1000));
        timer = setInterval(() => {
          i = Math.min(full.length, i + perFrame);
          text.innerHTML = `${escapeHtml(full.slice(0, i))}<span class="caret"></span>`;
          scrollToEnd();
          if (i >= full.length) {
            clearTimer();
            finish();
          }
        }, FRAME);
      }

      function scrollToEnd() {
        const body = bodyEl();
        if (body) body.scrollTop = body.scrollHeight;
      }

      /** 正在打字时点「继续」= 先把这段补完 */
      function skipTyping() {
        if (!typing) return false;
        clearTimer();
        const body = bodyEl();
        const last = body?.querySelector(".vsc-agent-text:last-of-type");
        const step = steps[index];
        if (last && step) {
          const imgHtml = (step.images || []).map((img) =>
            `<span class="vsc-img-emoji" data-src="${escapeHtml(img.src)}" title="${escapeHtml(img.alt || "")}">${img.emoji}</span>`
          ).join(" ");
          last.innerHTML = escapeHtml(String(step.text || "")) + (imgHtml ? ` ${imgHtml}` : "");
        }
        body?.querySelector(".vsc-agent-tool.running")?.classList.remove("running");
        typing = false;
        renderFoot();
        scrollToEnd();
        return true;
      }

      /** 主操作：打字中 -> 补完；否则 -> 下一步 */
      function advance() {
        if (skipTyping()) return;
        next();
      }

      function toggleAuto() {
        auto = !auto;
        if (auto && !typing && index < steps.length - 1) next();
        else renderFoot();
      }

      function stop() {
        auto = false;
        clearTimer();
        typing = false;
        renderFoot();
      }

      function renderFoot() {
        const foot = footEl();
        if (!foot) return;
        const total = steps.length;
        const done = index + 1;
        const finished = total > 0 && index >= total - 1 && !typing;

        if (!total) {
          foot.innerHTML = `<div class="vsc-agent-hint">打开一个章节后开始</div>`;
          return;
        }
        foot.innerHTML = `
          <div class="vsc-agent-hint">
            <span>${done} / ${total} 段</span>
            <span class="spacer"></span>
            <span>${typing ? "generating…" : finished ? "done" : auto ? "auto" : "paused"}</span>
          </div>
          <div class="vsc-agent-btns">
            <button type="button" class="vsc-agent-btn primary" data-agent="next" ${finished ? "disabled" : ""}>
              ${typing ? "跳过本段" : finished ? "已完成" : "继续"} <kbd>⏎</kbd>
            </button>
            <button type="button" class="vsc-agent-btn" data-agent="auto" ${finished ? "disabled" : ""}>
              ${auto ? "暂停" : "连续"}
            </button>
          </div>`;
      }

      return {
        load,
        next,
        seek,
        currentStep,
        advance,
        toggleAuto,
        stop,
        renderFoot,
        get index() { return index; },
        get total() { return steps.length; },
        get typing() { return typing; },
        get auto() { return auto; },
        get finished() { return steps.length > 0 && index >= steps.length - 1 && !typing; },
      };
    }

  return { SPEEDS, DEFAULT_SPEED, speedOf, createAgentRunner };
  },
  "src/shell/usage.js": function (__require) {
    /**
     * Usage 面板：仿 Claude Code 的额度显示。
     *
     * session (5h)  -> 当前章节进度
     * weekly  (7d)  -> 全书进度
     *
     * 数据源无关：只认一个 bar 列表，怎么算由调用方决定。
     *
     * @typedef {Object} UsageBar
     * @property {string} label    "Current session"
     * @property {string} window   "5h"
     * @property {number} pct      0~100
     * @property {string} [right]  右侧真实信息，如 "14/24 段"
     * @property {string} [resets] "resets 21:30"
     */

    const { escapeHtml } = __require("src/shell/util.js");
    /** 进度条字符宽度（TERMINAL 里用字符画） */
    const BAR_CELLS = 20;

    /** 重置时间：session 从现在起 5 小时，weekly 从现在起 7 天——纯装饰，为了像 */
    function resetHint(hours) {
      const t = new Date(Date.now() + hours * 3600 * 1000);
      if (hours >= 24) {
        return `resets ${["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][t.getDay()]}`;
      }
      return `resets ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
    }

    function clampPct(n) {
      const v = Number(n);
      if (!Number.isFinite(v)) return 0;
      return Math.min(100, Math.max(0, v));
    }

    /**
     * 字符画进度条，给 TERMINAL 用。
     * @param {number} pct
     */
    function barText(pct) {
      const p = clampPct(pct);
      const filled = Math.round((p / 100) * BAR_CELLS);
      return "█".repeat(filled) + "░".repeat(BAR_CELLS - filled);
    }

    /**
     * HTML 进度条，给 Agent 面板用。
     * @param {UsageBar[]} bars
     */
    function usageHtml(bars) {
      return (bars || []).map((b) => {
        const pct = clampPct(b.pct);
        // 接近读完时变绿——Claude Code 那边是越高越危险，这里反过来，高是好事
        const tone = pct >= 99 ? "done" : pct >= 75 ? "high" : "";
        return `<div class="vsc-usage-row">
          <div class="vsc-usage-head">
            <span class="name">${escapeHtml(b.label)}</span>
            <span class="win">(${escapeHtml(b.window)})</span>
            <span class="reset">${escapeHtml(b.resets || "")}</span>
          </div>
          <div class="vsc-usage-bar"><i class="${tone}" style="width:${pct}%"></i></div>
          <div class="vsc-usage-foot">
            <span>${pct}% used</span>
            <span class="right">${escapeHtml(b.right || "")}</span>
          </div>
        </div>`;
      }).join("");
    }

    /**
     * 终端风格的多行文本，给 TERMINAL / OUTPUT 用。
     * @param {UsageBar[]} bars
     */
    function usageLines(bars) {
      const list = bars || [];
      // 按最长标题对齐，别写死宽度——"Current week (all chapters) (7d)" 会把 resets 挤得没有空格
      const titles = list.map((b) => `${b.label} (${b.window})`);
      const width = Math.max(0, ...titles.map((t) => t.length)) + 2;

      const out = [];
      list.forEach((b, i) => {
        const pct = clampPct(b.pct);
        out.push(titles[i].padEnd(width) + (b.resets || ""));
        out.push(`${barText(pct)}  ${String(pct).padStart(3)}% used` + (b.right ? `     ${b.right}` : ""));

      });
      if (out.length) out.pop();
      return out;
    }

  "src/sources/epub/unzip.js": function (__require) {
    /**
     * 极简 zip 解包（epub 就是 zip），零第三方依赖。
     * 用原生 DecompressionStream("deflate-raw") 解 deflate，只支持 epub 实际会用到的
     * 两种存储方式：stored(0) 与 deflate(8)。
     */

    const EOCD_SIG = 0x06054b50;
    const EOCD64_LOCATOR_SIG = 0x07064b50;
    const EOCD64_SIG = 0x06064b50;

    /**
     * @param {ArrayBuffer} buffer
     * @returns {Promise<Map<string, Uint8Array>>} 路径 -> 解压后的字节
     */
    async function unzip(buffer) {
      const dv = new DataView(buffer);
      const u8 = new Uint8Array(buffer);
      const size = buffer.byteLength;

      // 从尾部回扫 EOCD（注释区最大 64KB）
      let eocd = -1;
      const floor = Math.max(0, size - 65557);
      for (let i = size - 22; i >= floor; i--) {
        if (dv.getUint32(i, true) === EOCD_SIG) {
          eocd = i;
          break;
        }
      }
      if (eocd < 0) throw new Error("不是合法的 zip / epub 文件（未找到 EOCD）");

      let count = dv.getUint16(eocd + 10, true);
      let cdOffset = dv.getUint32(eocd + 16, true);

        const locator = eocd - 20;

                AGENT_SPEEDS.map((sp) =>
                  `<div class="vsc-tree-row" data-action="speed" data-speed="${sp.id}" style="padding-left:8px">
                    <span class="vsc-file-ico">${sp.id === shell?.agentSpeed?.().id ? "✓" : " "}</span>
                    <span class="vsc-file-name">${escapeHtml(sp.label)}</span>
                    <span class="vsc-file-meta">${sp.cps ? `${sp.cps} 字/秒` : "不打字"}</span>
                  </div>`
                ).join("") +
                `<div class="vsc-tree-row" style="opacity:.55;pointer-events:none;margin-top:6px">伪装代码密度</div>` +
                DENSITIES.map((d) =>
                  `<div class="vsc-tree-row" data-action="density" data-density="${d.id}" style="padding-left:8px">
                    <span class="vsc-file-ico">${d.id === currentDensity().id ? "✓" : " "}</span>

                  </div>`
                ).join("") +
                `<div class="vsc-tree-row" style="opacity:.55;pointer-events:none;margin-top:6px">连续注释行上限</div>` +
                [["auto", "跟随密度"], [4, "4 行"], [6, "6 行"], [8, "8 行"], [12, "12 行"]].map(([v, label]) =>
                  `<div class="vsc-tree-row" data-action="maxrun" data-maxrun="${v}" style="padding-left:8px">
                    <span class="vsc-file-ico">${v === currentMaxRun() ? "✓" : " "}</span>
                    <span class="vsc-file-name">${escapeHtml(label)}</span>
                    <span class="vsc-file-meta">${v === "auto" ? `${currentDensity().maxRun} 行` : ""}</span>
                  </div>`
                ).join("") +
                `<div class="vsc-tree-row" style="opacity:.55;pointer-events:none;margin-top:6px">每行宽度（列）</div>` +
                `<div class="vsc-tree-row" data-action="wrap" data-wrap="auto" style="padding-left:8px">
                  <span class="vsc-file-ico">${wrapSet === "auto" ? "✓" : " "}</span>
                  <span class="vsc-file-name">自动（撑满编辑器）</span>
                  <span class="vsc-file-meta">${wrapSet === "auto" ? `${wrap} 列` : "—"}</span>
                </div>` +
                [72, 88, 104, 120, 140].map((n) =>
                  `<div class="vsc-tree-row" data-action="wrap" data-wrap="${n}" style="padding-left:8px">
                    <span class="vsc-file-ico">${n === wrapSet ? "✓" : " "}</span>
                    <span class="vsc-file-name">${n} 列</span>
                    <span class="vsc-file-meta">≈${Math.floor(n / 2)} 汉字</span>
                  </div>`
                ).join(""),
            };
          }
          return null;
        },

        panelHtml(panel) {
          if (panel === "problems") {
            const marks = progress.bookmarks || [];
            return marks.length
              ? `<div class="vsc-term-line vsc-term-warn">${marks.length} bookmarks  <span class="vsc-term-muted">// 点 × 删除，或输入 unmark &lt;序号&gt;</span></div>` +
                marks.slice().reverse().map((b, i) =>
                  `<div class="vsc-term-line vsc-term-row">` +
                  `<span class="vsc-term-muted">${marks.length - i}.</span>` +
                  `<span data-action="open" data-id="${escapeHtml(b.chapter)}" class="vsc-term-link">${escapeHtml(b.file || "")}</span>` +
                  `<span class="vsc-term-muted vsc-term-note">// ${escapeHtml(truncate(b.note || b.title || "", 80))}</span>` +
                  `<button type="button" class="vsc-row-x" data-action="unmark" data-at="${b.at}" title="删除这个书签">×</button>` +
                  `</div>`
                ).join("")
              : `<div class="vsc-term-line vsc-term-muted">No bookmarks yet. 在下方输入 mark 收藏当前章节。</div>`;
          }
          if (panel === "output") {
            return `
              <div class="vsc-term-line">[${escapeHtml(adapter.kind)}] ${escapeHtml(book.title)}</div>
              ${(adapter.info?.() || []).map((l) => `<div class="vsc-term-line">[${escapeHtml(adapter.kind)}] ${escapeHtml(l)}</div>`).join("")}
              <div class="vsc-term-line">[${escapeHtml(adapter.kind)}] chapters: ${chapters.length}</div>
              <div class="vsc-term-line vsc-term-muted">view: ${escapeHtml(currentStyle().label)} · font: ${codeSize()}px · wrap: ${resolveWrap()} cols${currentWrapSetting() === "auto" ? " (auto)" : ""} · decoy: ${escapeHtml(currentDensity().label)} (max ${currentMaxRun() === "auto" ? currentDensity().maxRun : currentMaxRun()} 行)</div>
              <div class="vsc-term-line vsc-term-muted">images mapped to emoji hover previews (500px @ 50%)</div>`;
          }
          // terminal
          if (usageReport.length) {
            const body = [
              `<div class="vsc-term-line vsc-term-muted">$ usage</div>`,
              ...usageReport.map((l) =>
                `<div class="vsc-term-line${/█|░/.test(l) ? " vsc-term-warn" : ""}">${escapeHtml(l) || "&nbsp;"}</div>`
              ),
              `<div class="vsc-term-line vsc-term-muted">// session = 当前章节，weekly = 全书；输入任意命令返回章节列表</div>`,
            ].join("");
            return body;
          }
          const head = currentChapter
            ? `<div class="vsc-term-line vsc-term-muted"># cat ${escapeHtml(currentChapter.file)}</div>` +
              `<div class="vsc-term-line">${escapeHtml(currentChapter.title)}  <span class="vsc-term-muted">${fmtWords(currentChapter.words || 0)} 字</span></div>`
            : `<div class="vsc-term-line vsc-term-muted"># 打开左侧任意章节开始阅读</div>`;
          const list = chapters.map((c) =>
            `<div class="vsc-term-line${c.href === currentChapter?.href ? " vsc-term-warn" : ""}">` +
            `${escapeHtml(c.file)}  <span class="vsc-term-muted">${escapeHtml(truncate(c.title, 60))}</span></div>`
          ).join("");
          const noteLines = notes.map((n) => `<div class="vsc-term-line vsc-term-warn">note: ${escapeHtml(n)}</div>`).join("");
          return `${head}${list}${noteLines}<div class="vsc-term-line">epub@${escapeHtml(book.title.slice(0, 16))} $</div>`;
        },

        commandLine: {
          placeholder: "$ 章节名跳转 / usage / agent / mark / font / wrap / code <密度> / run <行数> / note / view",
          submit(text) {
            const [cmd, ...rest] = text.split(/\s+/);
            const arg = rest.join(" ");
            if (cmd !== "usage") usageReport = [];

            if (cmd === "mark" && currentChapter) {
              const mark = {
                chapter: currentChapter.href,
                title: currentChapter.title,
                file: currentChapter.file,
                note: arg,
                at: Date.now(),
              };
              safeStore(addBookmark(id, mark), {
                ...progress,
                bookmarks: [...(progress.bookmarks || []), mark],
              }).then((st) => {
                progress = st;
                shell?.renderPanel();
                shell?.renderSidebar();
              });
              return;
            }
            if (cmd === "unmark") {
              const marks = progress.bookmarks || [];
              if (!marks.length) return;
              // 序号与 PROBLEMS 面板一致：1 是最早收藏的那条
              const n = Number(arg);
              const hit = Number.isFinite(n) && n >= 1 && n <= marks.length
                ? marks[n - 1]
                : marks[marks.length - 1];   // 不给序号就删最近一条
              if (hit) dropBookmark(hit.at);
              return;
            }
            if (cmd === "wrap") {
              setWrap(arg.trim() === "auto" ? "auto" : Number(arg));
              return;
            }
            if (cmd === "code") {
              setDensity(arg.trim());
              return;
            }
            if (cmd === "run") {
              setMaxRun(arg.trim() === "auto" ? "auto" : Number(arg));
              return;
            }
            if (cmd === "usage") {
              showUsage();
              return;
            }
            if (cmd === "agent") {
              const sub2 = arg.trim();
              if (sub2 === "on") shell?.setAgentOpen?.(true);
              else if (sub2 === "off") shell?.setAgentOpen?.(false);
              else if (sub2) shell?.setAgentSpeed?.(sub2);
              else shell?.toggleAgent?.();
              return;
            }
            if (cmd === "font" || cmd === "size") {
              shell?.setFontSize?.(Number(arg));
              shell?.renderSidebar();
              return;
            }
            if (cmd === "note") {
              notes.push(arg || "(empty)");
              shell?.renderPanel();
              return;
            }
            if (cmd === "view") {
              const hit = STYLES.find((s) => s.id === arg || s.ext === arg || s.label.toLowerCase() === arg.toLowerCase());
              if (hit) setStyle(hit.id);
              return;
            }
            // 其它输入当作章节名搜索并跳转
            const hit = chapters.find((c) =>
              c.title.toLowerCase().includes(text.toLowerCase()) || c.file.includes(text)
            );
            if (hit) shell?.openFile(hit.id);
          },
        },

        commands() {
          const style = currentStyle();
          return [
            ...chapters.map((c) => ({
              label: c.file,
              hint: truncate(c.title, 40),
              run: () => shell?.openFile(c.id),
            })),
            ...STYLES.filter((s) => s.id !== style.id).map((s) => ({
              label: `View: 切换到 ${s.label} 视图`,
              hint: `.${s.ext}`,
              run: () => setStyle(s.id),
            })),
            { label: "Usage: 查看阅读额度（session / weekly）", hint: "usage", run: showUsage },
            { label: "Agent: 开关 Agent 面板（逐段输出）", hint: "⌘I", run: () => shell?.toggleAgent?.() },
            ...AGENT_SPEEDS.map((sp) => ({
              label: `Agent: 输出速度 — ${sp.label}`,
              hint: `agent ${sp.id}`,
              run: () => {

                shell?.agent?.renderFoot?.();
              },
            })),
            { label: "Library: 打开书库 / 换一本书", hint: "epub", run: () => onOpenLibrary?.() },
            ...[["auto", "跟随密度"], [4, "4 行"], [6, "6 行"], [8, "8 行"], [12, "12 行"]]
              .filter(([v]) => v !== currentMaxRun())
              .map(([v, label]) => ({
                label: `Code: 连续注释行上限 — ${label}`,
                hint: `run ${v}`,
                run: () => setMaxRun(v),
              })),
            ...DENSITIES.filter((d) => d.id !== currentDensity().id).map((d) => ({
              label: `Code: 段落间伪装代码 — ${d.label}`,

              run: () => setDensity(d.id),
            })),
            ...FONT_SIZES.filter((px) => px !== codeSize()).map((px) => ({
              label: `Font: 字号 ${px}px${px === DEFAULT_FONT ? "（默认）" : ""}`,
              hint: `font ${px}`,
              run: () => {
                shell?.setFontSize?.(px);
                shell?.renderSidebar();
              },
            })),
            ...(currentWrapSetting() === "auto"
              ? []
              : [{ label: "Wrap: 自动撑满编辑器", hint: "wrap auto", run: () => setWrap("auto") }]),
            ...[72, 88, 104, 120, 140].filter((n) => n !== currentWrapSetting()).map((n) => ({
              label: `Wrap: 固定每行 ${n} 列（约 ${Math.floor(n / 2)} 个汉字）`,
              hint: `wrap ${n}`,
              run: () => setWrap(n),
            })),
            ...(progress.bookmarks || []).length
              ? [{
                  label: `Bookmark: 删除最近一个书签`,
                  hint: "unmark",
                  run: () => {
                    const marks = progress.bookmarks || [];
                    if (marks.length) dropBookmark(marks[marks.length - 1].at);
                  },
                }]
              : [],
            {
              label: "Bookmark: 收藏当前章节",
              hint: "mark",
              run: () => currentChapter && safeStore(
                addBookmark(id, {
                  chapter: currentChapter.href,
                  title: currentChapter.title,
                  file: currentChapter.file,
                }),
                progress
              ).then((st) => { progress = st; shell?.renderPanel(); }),
            },
          ];
        },

        /** 菜单栏内容 */
        menus() {
          const i = currentChapter ? chapters.findIndex((c) => c.href === currentChapter.href) : -1;
          const hasPrev = i > 0;

          return [
            {
              label: "File",

                  ? [
                      { type: "sep" },
                      { type: "title", label: "最近打开" },

                      })),
                    ]
                  : []),
                { type: "sep" },
                { label: "回到书库", run: () => onOpenLibrary?.() },

            },

              label: "Edit",

                { label: "全书搜索", hint: "⌘⇧F", run: () => {

                  shell?.renderSidebar();
                  document.querySelector(".vsc-side-search")?.focus();
                } },
                { label: "收藏当前章节", hint: "mark", run: () => {
                  if (!currentChapter) return;
                  safeStore(
                    addBookmark(id, {
                      chapter: currentChapter.href,
                      title: currentChapter.title,
                      file: currentChapter.file,
                    }),

                  ).then((st) => { progress = st; shell?.renderPanel(); shell?.renderSidebar(); });
                }, disabled: !currentChapter },

                { label: "命令面板…", hint: "⌘P", run: () => shell?.openPalette("") },
                { type: "sep" },
                { label: "切换浅色 / 深色主题", run: () => shell?.toggleTheme?.() },
                { label: "放大字号", hint: "⌘+", run: () => shell?.stepFontSize?.(1) },
                { label: "缩小字号", hint: "⌘-", run: () => shell?.stepFontSize?.(-1) },
                { label: "字号复位", hint: "⌘0", run: () => shell?.setFontSize?.(13) },

                { label: "切换 Agent 面板", hint: "⌘I", run: () => shell?.toggleAgent?.() },
              ],

            {
              label: "Go",

                { label: "下一章", hint: "⌘↓", run: () => gotoChapter(1), disabled: !hasNext },
                { type: "sep" },
                { label: "跳转到章节…", hint: "⌘P", run: () => shell?.openPalette("") },
                {
                  label: "继续上次阅读",
                  run: () => progress.chapterHref && shell?.openFile(progress.chapterHref),
                  disabled: !progress.chapterHref,
                },

            {

                { label: "Agent：输出下一段", hint: "⏎", run: () => {
                  shell?.setAgentOpen?.(true);
                  shell?.agent?.advance?.();
                } },

                  shell?.agent?.toggleAuto?.();

              items: [

                { label: "显示 TERMINAL 面板", hint: "⌘`", run: () => {
                  if (shell?.state) shell.state.panel = "terminal";
                  shell?.setPanelOpen?.(true) ?? shell?.renderPanel();
                  shell?.renderPanel();
                } },
              ],

            {
              label: "Help",
              items: [
                { label: `关于《${book.title}》`, run: () => {

                  shell?.renderPanel();

                { label: "书库 / 换一本书", run: () => onOpenLibrary?.() },
