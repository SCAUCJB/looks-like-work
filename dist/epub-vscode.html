        },

        /**
         * 额度条，仿 Claude Code 的 /usage：
         *   session (5h) = 当前章节进度
         *   weekly (7d)  = 全书进度
         * resets 时间是装饰，右侧给的是真实的段数 / 字数。
         */
        usageStats() {
          return buildUsage();
        },

        /**
         * Agent 面板的播放脚本：一段正文 = 一步。
         * 直接复用编辑器已经渲染好的行（同样的折行、同样的图片 emoji），
         * 按 para 归并回段落，这样两个面板看到的内容完全一致。
         */
        agentScript() {
          if (!currentChapter || !currentRows.length) return null;

          /** @type {Map<number, {lines: string[], images: any[]}>} */
          const byPara = new Map();
          for (const row of currentRows) {
            if (row.para == null) continue;
            if (!byPara.has(row.para)) byPara.set(row.para, { lines: [], images: [] });
            const bucket = byPara.get(row.para);
            // 去掉注释前缀，Agent 面板里是"说话"，不该带 # 或 //
            bucket.lines.push(stripCommentMark(row.text));
            if (row.images?.length) bucket.images.push(...row.images);
          }

          const file = currentChapter.file;
          const dir = `src/chapters/${file}`;
          let line = 1;
          const steps = [...byPara.entries()]
            .sort((a, b) => a[0] - b[0])
            .map(([para, bucket]) => {
              const text = bucket.lines.join("\n").trim();
              const from = line;
              line += bucket.lines.length + 1;
              return {
                tool: para === 0 ? "Read" : "Edit",
                path: dir,
                range: `L${from}-${line - 2}`,
                text,
                images: bucket.images,
                para,
              };
            })
            .filter((s) => s.text || s.images.length);

          return {
            // header 由 Agent 面板负责转义，这里给纯文本，别重复转义
            header: `继续实现 ${file}：逐段补完《${currentChapter.title}》，每段等我确认`,
            steps,
          };
        },

        /**
         * 当前文档变了（含切回已缓存的 tab）。
         * 缓存命中时 openFile 不会被调用，这里补上「当前章节 / 当前行」的同步，
         * 否则 Agent 脚本和额度统计会停在上一章。
         */
        onActivate(doc) {
          if (!doc) {
            currentChapter = null;
            currentRows = [];
            return;
          }
          const ch = byHref.get(doc.id);
          if (ch) currentChapter = ch;
          currentRows = doc.rows || [];
        },

        /** 行内动作：由 shell 的 data-action 委托转发过来 */
        onAction(action, data) {
          if (action === "unmark") {
            dropBookmark(Number(data.at));
            return;
          }
          if (action === "style") {
            setStyle(data.style || "");
            return;
          }
          if (action === "wrap") {
            setWrap(data.wrap === "auto" ? "auto" : Number(data.wrap));
            return;
          }
          if (action === "density") {
            setDensity(data.density || "");
            return;
          }
          if (action === "maxrun") {
            setMaxRun(data.maxrun === "auto" ? "auto" : Number(data.maxrun));
            return;
          }
          if (action === "font") {
            shell?.setFontSize?.(Number(data.font));
            shell?.renderSidebar();
            return;
          }
          if (action === "speed") {
            shell?.setAgentSpeed?.(data.speed || "");
            shell?.renderSidebar();
            return;
          }
          if (action === "library") {
            onOpenLibrary?.();
            return;
          }
          if (action === "open" && data.id) {
            shell?.openFile(data.id);
          }
        },

        /** 阅读位置变了（已防抖）：落库并刷新状态栏 */
        onScroll(para, ratio) {
          chapterRatio = ratio;
          updateStatus();
          if (!currentChapter) return;
          // 只在段落真的变了时写库，避免同一段内反复滚动频繁写入
          if (Number(progress.para) === para) return;
          safeStore(
            saveState(id, { chapterHref: currentChapter.href, para }),
            { ...progress, para }
          ).then((st) => { progress = st; });
        },

        /** 编辑器可用列数变了：auto 模式才需要重渲染 */
        onResize() {
          if (currentWrapSetting() !== "auto") return;
          reopenCurrent();
        },

        onReady(api) {
          shell = api;
          // 侧边栏搜索框在 search 视图下驱动全书检索
          const input = document.querySelector(".vsc-side-search");
          input?.addEventListener("input", (e) => {
            if (api.state.activity !== "search") return;
            search(/** @type {HTMLInputElement} */ (e.target).value.trim());
            api.renderSidebar();
          });
          // 恢复上次阅读位置
          safeStore(getState(id), { id, chapterHref: "", para: 0, bookmarks: [] }).then((st) => {
            progress = st;
            if (st.chapterHref && byHref.has(st.chapterHref)) api.openFile(st.chapterHref);
            else api.refresh();
          });
        },

        /** 暴露给外部（书库页）用 */
        _book: book,
      };

      /** 相对当前章节跳转（-1 上一章 / +1 下一章） */
      function gotoChapter(delta) {
        if (!currentChapter) {
          if (chapters[0]) shell?.openFile(chapters[0].id);
          return;
        }
        const i = chapters.findIndex((c) => c.href === currentChapter.href);
        const next = chapters[i + delta];
        if (next) shell?.openFile(next.id);
      }

      /** 删书签：刷新侧栏与面板 */
      function dropBookmark(at) {
        if (!Number.isFinite(at)) return;
        safeStore(removeBookmark(id, at), {
          ...progress,
          bookmarks: (progress.bookmarks || []).filter((b) => b.at !== at),
        }).then((st) => {
          progress = st;
          shell?.renderPanel();
          shell?.renderSidebar();
        });
      }

      /** 改连续注释行上限 */
      function setMaxRun(v) {
        if (v === "auto") {
          lsSet(MAXRUN_KEY, "auto");
          reopenCurrent();
          return;
        }
        const n = Number(v);
        if (!Number.isFinite(n)) return;
        lsSet(MAXRUN_KEY, String(Math.min(MAX_RUN_MAX, Math.max(MAX_RUN_MIN, Math.round(n)))));
        reopenCurrent();
      }

      /** 改伪装代码密度 */
      function setDensity(id) {
        if (!DENSITIES.some((d) => d.id === id)) return;
        lsSet(DENSITY_KEY, id);
        reopenCurrent();
      }

      /** 改折行宽度：传 "auto" 或具体列数。重渲染当前章节（清 tab 缓存，否则拿到的还是旧行） */
      function setWrap(cols) {
        if (cols === "auto") {
          lsSet(WRAP_KEY, "auto");
          reopenCurrent();
          return;
        }
        const n = Number(cols);
        if (!Number.isFinite(n)) return;
        lsSet(WRAP_KEY, String(Math.min(WRAP_MAX, Math.max(WRAP_MIN, Math.round(n)))));
        reopenCurrent();
      }

      /** 章节 -> 文件树的 file 节点 */
      function fileNode(ch, style) {
        return {
          kind: "file",
          id: ch.id,
          label: ch.file,
          // 文件名是 slug，中文书根本看不出是哪一章，hover 给出真实标题
          hint: ch.title,
          meta: ch.words ? fmtWords(ch.words) : "",
          icon: style.id === "markdown" ? "Ⓜ" : "📘",
          iconColor: "#519aba",
        };
      }

      function setStyle(styleId) {
        if (!STYLES.some((s) => s.id === styleId)) return;
        lsSet(STYLE_KEY, styleId);
        const ext = currentStyle().ext;
        chapters.forEach((c) => { c.file = chapterFileName(c.title, c.index, ext); });
        reopenCurrent();
      }

      /**
       * 丢掉 tab 缓存并重新打开当前章节，让新的风格 / 宽度 / 字号 / 密度生效。
       * 先把当前段落存进 pendingPara——改个字号就跳回章首太难用了。
       */
      function reopenCurrent() {
        const keep = currentChapter?.href;
        if (keep) pendingPara = shell?.currentPara?.() ?? null;
        if (shell?.state) shell.state.tabs.length = 0;
        if (keep) shell?.openFile(keep);
        else shell?.refresh();
      }
    }

    /** 去掉行首的注释标记，Agent 面板里显示的是"说的话"，不该带 # 或 // */
    function stripCommentMark(text) {
      return String(text || "")
        .replace(/^\s*(?:\/\/\s?|#\s?|\*\s?|<!--\s?)/, "")
        .replace(/\s*-->\s*$/, "")
        .replace(/^\/\*+\s?/, "")
        .replace(/\s*\*\/\s*$/, "");
    }

    function fmtWords(n) {
      return n >= 10000 ? `${(n / 10000).toFixed(1)}万` : String(n);
    }

    function guessMime(path) {
      const ext = (path.split(".").pop() || "").toLowerCase();
      return {
        jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif",
        svg: "image/svg+xml", webp: "image/webp", css: "text/css",
        xhtml: "application/xhtml+xml", html: "text/html",
        ttf: "font/ttf", otf: "font/otf", woff: "font/woff", woff2: "font/woff2",
      }[ext] || "application/octet-stream";
    }


    /**
     * EPUB 入口：保持原有调用方式不变。
     * @param {{files: Map<string, Uint8Array>, size: number, [k: string]: any}} args
     */
    function createEpubSource({ files, ...rest }) {
      return createBookSource({ adapter: createEpubAdapter(files), ...rest });
    }

  return { currentStyle, currentDensity, currentMaxRun, currentWrapSetting, currentWrap, createBookSource, createEpubSource, removeBookmark };
  },
  "src/shell/chunks.js": function (__require) {
    // 富文本 HTML -> 行块（chunks）：保留原始换行、抽出代码栅栏、图片转占位符
    // 输出结构：{ parts: [{kind:'text'|'fence', ...}], images: [{src, alt}] }

    const { IMG_EMOJI } = __require("src/shell/const.js");
    function sanitizeHtml(html) {
      const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
      doc.querySelectorAll("script,style,iframe,object,form,input,button").forEach((n) => n.remove());
      doc.querySelectorAll("*").forEach((el) => {
        [...el.attributes].forEach((attr) => {
          const name = attr.name.toLowerCase();
          const val = attr.value || "";
          if (name.startsWith("on") || name === "srcdoc" || /^(javascript|data):/i.test(val.trim())) {
            el.removeAttribute(attr.name);
          }
        });
      });
      return doc.body.firstChild ? doc.body.firstChild.innerHTML : "";
    }

    function htmlToPlainText(html) {
      const box = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
      box.querySelectorAll("img").forEach((img, i) => {
        img.replaceWith(box.createTextNode(` ${IMG_EMOJI[i % IMG_EMOJI.length]} `));
      });
      box.querySelectorAll("br").forEach((br) => br.replaceWith(box.createTextNode("\n")));
      box.querySelectorAll("p,div,li,blockquote,pre,tr,section,article,h1,h2,h3,h4,h5,h6").forEach((el) => {
        el.appendChild(box.createTextNode("\n"));
      });
      return String(box.body.textContent || "")
        .replace(/\r/g, "")
        .replace(/[ \t]+$/gm, "")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function htmlToOneLine(html) {
      return htmlToPlainText(html).replace(/\s*\n\s*/g, " ⏎ ");
    }

    function htmlToChunks(html) {
      const box = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
      const images = [...box.querySelectorAll("img")].map((img, i) => ({
        src: img.getAttribute("src") || "",
        alt: img.getAttribute("alt") || img.getAttribute("title") || `image-${i + 1}`,
      })).filter((x) => x.src);
      box.querySelectorAll("img").forEach((img, i) => {
        img.replaceWith(box.createTextNode(` ⟦IMG:${i}⟧ `));
      });

      // 保留原始换行：<br> 转成 \n，块级元素末尾补 \n（textContent 不会为它们产生换行）
      box.querySelectorAll("br").forEach((br) => br.replaceWith(box.createTextNode("\n")));
      box.querySelectorAll("p,div,li,blockquote,h1,h2,h3,h4,h5,h6,tr,section,article").forEach((el) => {
        el.appendChild(box.createTextNode("\n"));
      });

      const fences = [];
      const takeCodeEl = (el) => {
        const codeEl = el.matches("pre") ? (el.querySelector("code") || el) : el;
        const lang = (
          (codeEl.getAttribute("class") || "").match(/(?:language|lang)-([\w+-]+)/i) ||
          (el.getAttribute("class") || "").match(/(?:language|lang)-([\w+-]+)/i) ||
          []
        )[1] || "";
        const body = String(codeEl.textContent || "").replace(/\r/g, "").replace(/\n$/, "");
        if (!body.trim()) return;
        const token = `⟦CODE:${fences.length}⟧`;
        fences.push({ lang, lines: body.split("\n") });
        el.replaceWith(box.createTextNode(` ${token} `));
      };
      box.querySelectorAll("pre").forEach(takeCodeEl);
      box.querySelectorAll("code").forEach((el) => {
        if (el.closest("pre")) return;
        const t = el.textContent || "";
        if (t.includes("\n") || t.length > 72) takeCodeEl(el);
      });

      const text = (box.body.textContent || "")
        .replace(/\r/g, "")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n{3,}/g, "\n\n");

      function pushSentences(raw, parts) {
        const block = String(raw || "");
        if (!block.trim()) return;
        // 保留原始换行结构，不拆句、不硬切长行
        const lines = block.replace(/\r/g, "").split("\n");
        while (lines.length && !lines[0].trim()) lines.shift();
        while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
        lines.forEach((line) => {
          parts.push({ kind: "text", value: line.replace(/[ \t]+$/g, "") });
        });
      }

      function absorbMarkdownFences(raw, parts) {
        const fenceRe = /```([\w+-]*)[ \t]*\n?([\s\S]*?)```/g;
        let last = 0;
        let m;
        while ((m = fenceRe.exec(raw))) {
          pushSentences(raw.slice(last, m.index), parts);
          const body = String(m[2] || "").replace(/\n$/, "");
          if (body.trim()) parts.push({ kind: "fence", lang: m[1] || "", lines: body.split("\n") });
          last = m.index + m[0].length;
        }
        pushSentences(raw.slice(last), parts);
      }

      const parts = [];
      const tokenRe = /⟦CODE:(\d+)⟧/g;
      let last = 0;
      let m;
      while ((m = tokenRe.exec(text))) {
        absorbMarkdownFences(text.slice(last, m.index), parts);
        const fence = fences[Number(m[1])];
        if (fence) parts.push({ kind: "fence", lang: fence.lang, lines: fence.lines.slice() });
        last = m.index + m[0].length;
      }
      absorbMarkdownFences(text.slice(last), parts);
      return { parts, images };
    }

  return { sanitizeHtml, htmlToPlainText, htmlToOneLine, htmlToChunks };
  },
  "src/sources/epub/adapter.js": function (__require) {
    /**
     * EPUB 的 BookAdapter：把 epub 包装成 createBookSource 认识的形状。
     *
     * @typedef {Object} BookAdapter
     * @property {string} kind                       "epub" / "pdf"，只用于展示
     * @property {{title: string, author: string}} meta
     * @property {{href: string, title: string, depth: number, parent: string|null,
     *             anchors: {label: string, anchor: string}[]}[]} chapters
     * @property {(href: string) => {bytes?: Uint8Array, paras?: string[]} | null} contentOf
     * @property {(href: string) => string} plainOf  检索用纯文本
     * @property {(path: string) => string} [blobUrlFor]
     * @property {() => string} [coverUrl]
     * @property {() => string[]} [info]             OUTPUT 面板里的诊断行
     */

    const { parseBook, buildTocIndex } = __require("src/sources/epub/opf.js");
    const { htmlToPlainText } = __require("src/shell/chunks.js");
    const decoder = new TextDecoder("utf-8");

    /**
     * @param {Map<string, Uint8Array>} files
     * @returns {BookAdapter}
     */
    function createEpubAdapter(files) {
      const book = parseBook(files);
      const { index: tocIndex, groups: tocGroups } = buildTocIndex(book.toc);

      // 只有 xhtml/html 才是可读章节，图片和 CSS 不进文件树。
      // 顺序取自 spine（那才是真正的阅读顺序），层级取自 TOC 的父子关系。
      const readable = book.spine.filter(
        (s) => /x?html/i.test(s.mediaType) || /\.x?html?$/i.test(s.href)
      );
      const inSpine = new Set(readable.map((s) => s.href));

      const parentOf = (id) => tocIndex.get(id)?.parent ?? tocGroups.get(id)?.parent ?? null;

      /**
       * 往上找第一个能当父级的祖先。
       * 分组节点（第一部分 / Part I）总是有效——它本来就不对应文件；
       * 指向文件的条目则要求那个文件确实在 spine 里，
       * 否则（比如 TOC 指向了不参与阅读顺序的扉页）继续上溯，别把整棵子树丢掉。
       */
      function resolveParent(startId) {
        const seen = new Set();
        let p = startId;
        while (p && !seen.has(p)) {
          seen.add(p);
          if (tocGroups.has(p) || inSpine.has(p)) return p;
          p = parentOf(p);
        }
        return null;
      }

      // 分组节点的父级同样要解析一遍，它们也可能挂在别的分组下
      const groups = new Map();
      for (const [id, g] of tocGroups) {
        groups.set(id, { id, label: g.label, depth: g.depth, parent: resolveParent(g.parent) });
      }

      let lastParent = null;
      const chapters = readable.map((s, i) => {
        const hit = tocIndex.get(s.href);
        let parent;
        if (hit) {
          parent = resolveParent(hit.parent);
          lastParent = parent;
        } else {
          // TOC 没覆盖的文件（插页、版权页等）：继承前一个章节的父级。
          // 当成顶层的话，它会把后面本属于上一章的子章全抢过去。
          parent = lastParent;
        }
        return {
          href: s.href,
          title: hit?.label || `Chapter ${i + 1}`,
          depth: hit?.depth ?? 0,
          parent,
          anchors: hit?.anchors || [],
        };
      });

      /** blob URL 缓存：同一张图只创建一次 */
      const blobUrls = new Map();

      function blobUrlFor(zipPath) {
        if (!zipPath) return "";
        if (blobUrls.has(zipPath)) return blobUrls.get(zipPath);
        const bytes = files.get(zipPath);
        if (!bytes) {
          blobUrls.set(zipPath, "");
          return "";
        }
        const item = book.byHref.get(zipPath);
        const url = URL.createObjectURL(
          new Blob([bytes], { type: item?.mediaType || guessMime(zipPath) })
        );
        blobUrls.set(zipPath, url);
        return url;
      }

      /** 取章节 body（检索和渲染都要用） */
      function bodyOf(href) {
        const bytes = files.get(href);
        if (!bytes) return "";
        const raw = decoder.decode(bytes);
        const m = raw.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
        return m ? m[1] : raw;
      }

      return {
        kind: "epub",
        meta: { title: book.title, author: book.author, publisher: book.publisher, language: book.language },
        chapters,
        // 只有标题、不对应文件的分组节点（第一部分 / Part I），建树时要用
        groups,
        contentOf: (href) => (files.has(href) ? { bytes: files.get(href) } : null),
        plainOf: (href) => htmlToPlainText(bodyOf(href)),
        blobUrlFor,
        coverUrl: () => (book.coverHref ? blobUrlFor(book.coverHref) : ""),
        info: () => [
          `opf: ${book.opfPath}`,
          `spine: ${book.spine.length} items`,
          `manifest: ${book.manifest.size} resources`,
          `toc: ${book.toc.length} top-level entries`,
        ],
      };
    }

    function guessMime(path) {
      const ext = (path.split(".").pop() || "").toLowerCase();
      return {
        jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", gif: "image/gif",
        svg: "image/svg+xml", webp: "image/webp", css: "text/css",
        xhtml: "application/xhtml+xml", html: "text/html",
        ttf: "font/ttf", otf: "font/otf", woff: "font/woff", woff2: "font/woff2",
      }[ext] || "application/octet-stream";
    }

  return { createEpubAdapter };
  },
  "src/sources/epub/opf.js": function (__require) {
    /**
     * epub 结构解析：container.xml -> OPF（metadata / manifest / spine）-> TOC
     * 兼容 EPUB2（toc.ncx）与 EPUB3（nav.xhtml）。
     */

    const { resolvePath } = __require("src/sources/epub/unzip.js");
    /**
     * @typedef {Object} SpineItem
     * @property {string} id
     * @property {string} href       zip 内完整路径
     * @property {string} mediaType
     * @property {number} index      spine 顺序（从 0 起）
     *
     * @typedef {Object} TocNode
     * @property {string} label
     * @property {string} href       zip 内完整路径（不含 #anchor）
     * @property {string} anchor
     * @property {TocNode[]} children
     *
     * @typedef {Object} Book
     * @property {string} title
     * @property {string} author
     * @property {string} language
     * @property {string} publisher
     * @property {string} opfPath
     * @property {string} base
     * @property {SpineItem[]} spine
     * @property {Map<string, SpineItem>} manifest    id -> item
     * @property {Map<string, SpineItem>} byHref      href -> item
     * @property {TocNode[]} toc
     * @property {string} coverHref
     */

    const parser = new DOMParser();
    const decoder = new TextDecoder("utf-8");

    /** @param {Map<string, Uint8Array>} files */
    function readText(files, path) {
      const bytes = files.get(path);
      if (!bytes) throw new Error(`epub 内缺少文件: ${path}`);
      return decoder.decode(bytes);
    }

    function parseXml(text) {
      const doc = parser.parseFromString(text, "application/xml");
      if (doc.querySelector("parsererror")) {
        // 有些书的 xhtml 不严格合法，退回 HTML 解析器
        return parser.parseFromString(text, "text/html");
      }
      return doc;
    }

    /**
     * @param {Map<string, Uint8Array>} files
     * @returns {Book}
     */
    function parseBook(files) {
      // 1. container.xml 指向 OPF
      const container = parseXml(readText(files, "META-INF/container.xml"));
      const rootfile = container.querySelector("rootfile");
      const opfPath = rootfile?.getAttribute("full-path");
      if (!opfPath) throw new Error("epub 缺少 rootfile（container.xml 异常）");
      const base = opfPath.includes("/") ? opfPath.replace(/\/[^/]+$/, "/") : "";

      // 2. OPF：metadata / manifest / spine
      const opf = parseXml(readText(files, opfPath));

      /** @type {Map<string, SpineItem>} */
      const manifest = new Map();
      /** @type {Map<string, SpineItem>} */
      const byHref = new Map();
      opf.querySelectorAll("manifest > item").forEach((it) => {
        const id = it.getAttribute("id") || "";
        const rawHref = it.getAttribute("href") || "";
        if (!id || !rawHref) return;
        const item = {
          id,
          href: resolvePath(base, rawHref),
          mediaType: it.getAttribute("media-type") || "",
          properties: it.getAttribute("properties") || "",
          index: -1,
        };
        manifest.set(id, item);
        byHref.set(item.href, item);
      });

      /** @type {SpineItem[]} */
      const spine = [];
      opf.querySelectorAll("spine > itemref").forEach((ref) => {
        const item = manifest.get(ref.getAttribute("idref") || "");
        // linear="no" 一般是封面/版权页，仍收进来但不参与进度计算
        if (!item) return;
        item.index = spine.length;
        item.linear = ref.getAttribute("linear") !== "no";
        spine.push(item);
      });
      if (!spine.length) throw new Error("epub 的 spine 为空，无法确定阅读顺序");

      const meta = (tag) => {
        const el = [...opf.querySelectorAll("metadata > *")].find(
          (n) => n.localName === tag || n.nodeName === `dc:${tag}`
        );
        return el?.textContent?.trim() || "";
      };

      // 3. TOC：EPUB3 nav 优先，回落 EPUB2 ncx
      const navItem = [...manifest.values()].find((i) => (i.properties || "").includes("nav"));
      const ncxId = opf.querySelector("spine")?.getAttribute("toc");
      const ncxItem = (ncxId && manifest.get(ncxId)) ||
        [...manifest.values()].find((i) => i.mediaType === "application/x-dtbncx+xml");

      let toc = [];
      try {
        if (navItem && files.has(navItem.href)) {
          toc = parseNav(readText(files, navItem.href), navItem.href);
        } else if (ncxItem && files.has(ncxItem.href)) {
          toc = parseNcx(readText(files, ncxItem.href), ncxItem.href);
        }
      } catch (err) {
        console.warn("[epub] TOC 解析失败，回落到 spine 顺序", err);
      }
      if (!toc.length) {
        toc = spine.filter((s) => s.mediaType.includes("html")).map((s, i) => ({
          label: `Chapter ${i + 1}`,
          href: s.href,
          anchor: "",
          children: [],
        }));
      }

      // 4. 封面
      const coverMeta = opf.querySelector('metadata > meta[name="cover"]')?.getAttribute("content");
      const coverItem =
        (coverMeta && manifest.get(coverMeta)) ||
        [...manifest.values()].find((i) => (i.properties || "").includes("cover-image")) ||
        [...manifest.values()].find((i) => /cover/i.test(i.href) && i.mediaType.startsWith("image/"));

      return {
        title: meta("title") || "untitled",
        author: meta("creator"),
        language: meta("language"),
        publisher: meta("publisher"),
        opfPath,
        base,
        spine,
        manifest,
        byHref,
        toc,
        coverHref: coverItem?.href || "",
      };
    }

    /** EPUB3：nav.xhtml 里 <nav epub:type="toc"> 下的嵌套 <ol> */
    function parseNav(text, navPath) {
      const doc = parseXml(text);
      const navBase = navPath.includes("/") ? navPath.replace(/\/[^/]+$/, "/") : "";
      const nav =
        [...doc.querySelectorAll("nav")].find((n) =>
          (n.getAttribute("epub:type") || n.getAttribute("type") || "").includes("toc")
        ) || doc.querySelector("nav");
      if (!nav) return [];

      /** @param {Element} ol */
      const walk = (ol) => [...ol.children]
        .filter((li) => li.localName === "li")
        .map((li) => {
          const a = li.querySelector(":scope > a, :scope > span");
          const raw = a?.getAttribute("href") || "";
          const childOl = li.querySelector(":scope > ol");
          return {
            label: (a?.textContent || "").replace(/\s+/g, " ").trim() || "(untitled)",
            href: raw ? resolvePath(navBase, raw) : "",
            anchor: raw.includes("#") ? raw.split("#")[1] : "",
            children: childOl ? walk(childOl) : [],
          };
        });

      const rootOl = nav.querySelector("ol");
      return rootOl ? walk(rootOl) : [];
    }

    /** EPUB2：toc.ncx 的 navPoint 天然嵌套 */
    function parseNcx(text, ncxPath) {
      const doc = parseXml(text);
      const ncxBase = ncxPath.includes("/") ? ncxPath.replace(/\/[^/]+$/, "/") : "";

      /** @param {Element} parent */
      const walk = (parent) => [...parent.children]
        .filter((n) => n.localName === "navPoint")
        .map((np) => {
          const raw = np.querySelector(":scope > content")?.getAttribute("src") || "";
          return {
            label: (np.querySelector(":scope > navLabel > text")?.textContent || "")
              .replace(/\s+/g, " ").trim() || "(untitled)",
            href: raw ? resolvePath(ncxBase, raw) : "",
            anchor: raw.includes("#") ? raw.split("#")[1] : "",
            children: walk(np),
          };
        });

      const navMap = doc.querySelector("navMap");
      return navMap ? walk(navMap) : [];
    }

    /**
     * 把 TOC 摊平成「条目索引 + 分组索引」。
     *
     * 两个关键设计：
     *
     * 1. **记 parent（父条目的 id），不是 depth 数字。**
     *    章节顺序取自 spine，depth 一旦按 spine 顺序重排就还原不出真实父子关系了：
     *    TOC 里 A 有个子章 C，但 spine 里 B 夹在 A 和 C 中间，
     *    depth 序列就成了 [0, 0, 1]，栈式重建只能把 C 挂到最近的 B 上——挂错了。
     *

     * 2. 失败的 promise 不能永久缓存，否则后续每次调用都拿到同一个死掉的 promise；
     * 3. 立刻挂一个 catch，免得它在调用方 await 之前就被判定为 unhandled rejection

          req = indexedDB.open(DB_NAME, DB_VERSION);
        } catch (err) {
          reject(err instanceof Error ? err : new Error(String(err)));
          return;
        }
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE_BOOKS)) {
            db.createObjectStore(STORE_BOOKS, { keyPath: "id" });
          }
          if (!db.objectStoreNames.contains(STORE_STATE)) {
            db.createObjectStore(STORE_STATE, { keyPath: "id" });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error || new Error("IndexedDB 打开失败"));
        req.onblocked = () => reject(new Error("IndexedDB 被其它标签页占用"));
      });

      // 失败就清掉缓存，下次还能重试；这个 catch 同时让 p 不会变成 unhandled rejection
      p.catch(() => { dbPromise = null; });
      dbPromise = p;

     * @param {(store: IDBObjectStore) => IDBRequest | void} fn
     *
     * 取值必须走 request.onsuccess 拿 request.result。
     * 不能在 transaction.oncomplete 里用 `req.result !== undefined ? req.result : req`
     * 兜底——记录不存在时 result 本来就是 undefined，那样会把 IDBRequest 对象
     * 本身当成数据返回，调用方 `row || 默认值` 判断失效，再存回去就 DataCloneError。
     */
    async function tx(storeName, mode, fn) {
      const db = await openDb();
      return new Promise((resolve, reject) => {
        const t = db.transaction(storeName, mode);
        const store = t.objectStore(storeName);
        let value;
        let req;
        try {
          req = fn(store);
        } catch (err) {
          reject(err);
          return;
        }
        if (req && typeof req === "object" && "onsuccess" in req) {
          req.onsuccess = () => { value = req.result; };
          req.onerror = () => reject(req.error);
        }
        t.oncomplete = () => resolve(value);
        t.onerror = () => reject(t.error);
        t.onabort = () => reject(t.error || new Error("事务被中止"));
      });
    }

    /** 书的唯一 id：书名 + 大小，避免同一本书重复入库 */
    function bookId(title, size) {
      const safe = String(title || "untitled").replace(/\s+/g, "-").slice(0, 60);
      return `${safe}@${size}`;
    }

    /**
     * @param {{id: string, title: string, author: string, size: number, blob: Blob}} book
     */
    async function putBook(book) {
      return tx(STORE_BOOKS, "readwrite", (s) => s.put({ ...book, addedAt: Date.now() }));
    }

    async function listBooks() {
      const rows = await tx(STORE_BOOKS, "readonly", (s) => s.getAll());
      return (rows || [])
        .map(({ blob, ...meta }) => meta)  // 列表不带 blob，避免一次性读出几十 MB
        .sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
    }

    async function getBookBlob(id) {
      const row = await tx(STORE_BOOKS, "readonly", (s) => s.get(id));
      return row?.blob || null;
    }

    async function deleteBook(id) {
      await tx(STORE_BOOKS, "readwrite", (s) => s.delete(id));
      await tx(STORE_STATE, "readwrite", (s) => s.delete(id));
    }

    /**
     * 阅读状态。para 是正文段落序号——它不随字号 / 折行宽度 / 伪装代码密度变化，
     * 比滚动像素或行号都稳，所以拿它当阅读位置的锚点。
     * @returns {Promise<{id: string, chapterHref: string, para: number, bookmarks: any[]}>}
     */
    async function getState(id) {
      const row = await tx(STORE_STATE, "readonly", (s) => s.get(id));
      return row || { id, chapterHref: "", para: 0, bookmarks: [] };
    }

    async function saveState(id, patch) {
      const cur = await getState(id);
      const next = { ...cur, ...patch, id, updatedAt: Date.now() };
      await tx(STORE_STATE, "readwrite", (s) => s.put(next));
      return next;
    }

    async function addBookmark(id, mark) {
      const cur = await getState(id);
      const bookmarks = [...(cur.bookmarks || []), { ...mark, at: Date.now() }].slice(-200);
      return saveState(id, { bookmarks });
    }

    async function removeBookmark(id, at) {
      const cur = await getState(id);
      return saveState(id, { bookmarks: (cur.bookmarks || []).filter((b) => b.at !== at) });
    }

  return { bookId, putBook, listBooks, getBookBlob, deleteBook, getState, saveState, addBookmark, removeBookmark };
  },
  "src/sources/pdf/load.js": function (__require) {
    /**
     * 用 pdf.js 把 PDF 读成「章节 + 段落」的结构，喂给和 EPUB 同一套 Source 适配器。
     *
     * pdf.js 是构建时内联进产物的（见 build.mjs 的 vendor 处理），
     * 通过 globalThis.pdfjsLib 取用；worker 源码以字符串形式内联，运行时转成 blob URL。
     * 只读 epub 的那个产物不含 pdf.js，所以这里的入口都要先检查可用性。
     */

    const { itemsToLines, findRunningHeads, linesToParagraphs } = __require("src/sources/pdf/extract.js");
    /** 这个产物里有没有打包 pdf.js */
    function pdfAvailable() {
      return typeof globalThis.pdfjsLib?.getDocument === "function";
    }

    let workerReady = false;

    /** 把内联的 worker 源码转成 blob URL 交给 pdf.js */
    function setupWorker() {
      if (workerReady) return;
      const lib = globalThis.pdfjsLib;
      const src = globalThis.__pdfWorkerSrc;
      if (!lib?.GlobalWorkerOptions) return;
      if (typeof src === "string" && src.length > 1000) {
        const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        lib.GlobalWorkerOptions.workerSrc = url;
      } else {
        // 没有 worker 就退回主线程解析：大文件会卡一下，但不至于打不开
        console.warn("[pdf] 没有内联 worker，改用主线程解析");
        lib.GlobalWorkerOptions.workerSrc = "";
      }
      workerReady = true;
    }

    /**
     * @typedef {Object} PdfChapter
     * @property {string} id
     * @property {string} title
     * @property {number} page      起始页（1 起）
     * @property {number} depth     目录层级
     * @property {{text: string, page: number}[]} paras
     *
     * @typedef {Object} PdfBook
     * @property {string} title
     * @property {string} author
     * @property {number} pages
     * @property {PdfChapter[]} chapters
     * @property {boolean} hasText   有没有文本层（扫描版就是 false）
     */

    /**
     * @param {ArrayBuffer} buffer
     * @param {(msg: string) => void} [onProgress]
     * @returns {Promise<PdfBook>}
     */
    async function loadPdf(buffer, onProgress) {
      if (!pdfAvailable()) {
        throw new Error("这个版本没有内置 PDF 支持，请使用 reader-vscode.html");
      }
      setupWorker();

      const lib = globalThis.pdfjsLib;
      const doc = await lib.getDocument({
        data: new Uint8Array(buffer),
        // 字体和 CMap 都没随包，禁用掉避免去网上取
        disableFontFace: true,
        isEvalSupported: false,
      }).promise;

      const meta = await doc.getMetadata().catch(() => null);
      const info = meta?.info || {};

      // 逐页提取文本
      /** @type {import("./extract.js").Line[][]} */
      const pageLines = [];
      for (let p = 1; p <= doc.numPages; p++) {
        if (p % 10 === 0 || p === 1) onProgress?.(`正在提取文本 ${p}/${doc.numPages} 页…`);
        const page = await doc.getPage(p);
        const content = await page.getTextContent();
        pageLines.push(itemsToLines(content.items || []));
        page.cleanup();
      }

      const totalChars = pageLines.flat().reduce((n, l) => n + l.text.length, 0);
      const hasText = totalChars > doc.numPages * 20;   // 平均每页 20 字都没有，基本可以判定是扫描版

      onProgress?.("正在还原段落…");
      const heads = findRunningHeads(pageLines);
      const paras = linesToParagraphs(pageLines, heads);

      // 目录：优先用 PDF 自带的 outline，没有就按页切
      onProgress?.("正在整理目录…");
      const outline = await doc.getOutline().catch(() => null);
      const marks = await outlineToPages(doc, outline);
      const chapters = marks.length
        ? splitByOutline(paras, marks)
        : splitByPages(paras, doc.numPages);

      return {
        title: (info.Title || "").trim() || "untitled",
        author: (info.Author || "").trim(),
        pages: doc.numPages,
        chapters,
        hasText,
      };
    }

    /** outline 条目 -> 页码 */
    async function outlineToPages(doc, outline, depth = 0, out = []) {
      if (!Array.isArray(outline)) return out;
      for (const node of outline) {
        let page = 0;
        try {
          const dest = typeof node.dest === "string"
            ? await doc.getDestination(node.dest)
            : node.dest;
          if (Array.isArray(dest) && dest[0]) {
            page = (await doc.getPageIndex(dest[0])) + 1;
          }
        } catch {
          // 目标解析不了就跳过这一条，不影响其它条目
        }
        const title = String(node.title || "").replace(/\s+/g, " ").trim();
        if (page > 0 && title) out.push({ title, page, depth });
        if (node.items?.length) await outlineToPages(doc, node.items, depth + 1, out);
      }
      return out;
    }

    /** 按目录切分段落 */
    function splitByOutline(paras, marks) {
      const sorted = [...marks].sort((a, b) => a.page - b.page);
      /** @type {PdfChapter[]} */
      const chapters = [];

      // 目录第一条之前的内容（封面、版权页等）单独成章
      if (sorted[0] && sorted[0].page > 1) {
        const head = paras.filter((p) => p.page < sorted[0].page);
        if (head.length) {
          chapters.push({ id: "front", title: "front-matter", page: 1, depth: 0, paras: head });
        }
      }

      sorted.forEach((m, i) => {
        const next = sorted[i + 1];
        const from = m.page;
        const to = next ? next.page : Infinity;
        // 同一页里有多个目录项时，页内不再细分，内容归给第一个
        const paged = paras.filter((p) => p.page >= from && p.page < to);
        chapters.push({
          id: `ch${i}`,
          title: m.title,
          page: m.page,
          depth: m.depth,
          paras: next && next.page === m.page ? [] : paged,
        });
      });

      return chapters.filter((c) => c.paras.length || c.title);
    }

    /** 没有目录时按页分组 */
    function splitByPages(paras, numPages, per = 10) {
      /** @type {PdfChapter[]} */
      const chapters = [];
      for (let start = 1; start <= numPages; start += per) {
        const end = Math.min(numPages, start + per - 1);
        const group = paras.filter((p) => p.page >= start && p.page <= end);
        if (!group.length) continue;
        chapters.push({
          id: `p${start}`,
          title: `第 ${start}–${end} 页`,
          page: start,
          depth: 0,
          paras: group,
        });
      }
      return chapters;
    }

  return { pdfAvailable, loadPdf };
  },
  "src/sources/pdf/extract.js": function (__require) {
    /**
     * PDF 文本提取：把带坐标的文本片段还原成段落。
     *
     * PDF 里没有「段落」这个概念，只有一堆定位好的字符串。pdf.js 的 getTextContent()
     * 返回的是 { str, transform, width, height } 列表，顺序是绘制顺序，不一定是阅读顺序。
     * 所以要自己重建：
     *
     *   1. 按 y 坐标聚成行（同一行的片段 y 值接近，但不会完全相等）
     *   2. 行内按 x 排序，按间距决定要不要补空格
     *   3. 统计正文行距，据此判断换行是「同段续行」还是「新段落」
     *   4. 剔除页眉页脚（每页同一位置反复出现的短行）
     *   5. 合并英文连字符换行（hyphenation）
     *
     * 目标是单栏的电子书 / 导出文档。双栏论文会串行——需要分栏检测，暂不支持。
     */

    /** 同一行的 y 容差（相对字高的比例） */
    const LINE_TOL = 0.5;
    /** 行距超过正文行距的这个倍数，就认为是新段落 */
    const PARA_GAP = 1.6;
    /** 页眉页脚判定：出现在超过这个比例的页面上 */
    const REPEAT_RATIO = 0.5;

    /**
     * @typedef {Object} TextItem
     * @property {string} str
     * @property {number[]} transform  [a, b, c, d, e, f]，e/f 是 x/y
     * @property {number} width
     * @property {number} height
     *
     * @typedef {Object} Line
     * @property {string} text
     * @property {number} x      行首 x
     * @property {number} y
     * @property {number} size   字高
     */

    /**
     * 一页的文本片段 -> 行
     * @param {TextItem[]} items
     * @returns {Line[]}
     */
    function itemsToLines(items) {
      /** @type {{y: number, size: number, parts: {x: number, str: string, w: number}[]}[]} */
      const rows = [];

      for (const it of items) {
        const str = it.str;
        if (!str) continue;
        const x = it.transform[4];
        const y = it.transform[5];
        const size = Math.abs(it.transform[3]) || it.height || 10;
        if (!str.trim()) continue;

        // 找一个 y 接近的已有行；PDF 里同一行的片段 y 不会完全相等
        const tol = Math.max(1, size * LINE_TOL);
        let row = null;
        for (let i = rows.length - 1; i >= 0 && rows.length - i < 6; i--) {
          if (Math.abs(rows[i].y - y) <= tol) {
            row = rows[i];
            break;
          }
        }
        if (!row) {
          row = { y, size, parts: [] };
          rows.push(row);
        }
        row.size = Math.max(row.size, size);
        row.parts.push({ x, str, w: it.width || 0 });
      }

      return rows
        // PDF 坐标系原点在左下角，y 大的在上面
        .sort((a, b) => b.y - a.y)
        .map((row) => {
          const parts = row.parts.sort((p, q) => p.x - q.x);
          let text = "";
          let prevEnd = null;
          for (const p of parts) {
            if (prevEnd !== null) {
              const gap = p.x - prevEnd;
              // 间距超过大约半个字宽就补一个空格；中文之间不需要
              const needSpace =
                gap > row.size * 0.22 &&
                !/[\s　]$/.test(text) &&
                !/^[\s　]/.test(p.str) &&
                !(isCJK(text.slice(-1)) && isCJK(p.str[0]));
              if (needSpace) text += " ";
            }
            text += p.str;
            prevEnd = p.x + p.w;
          }
          return { text: text.replace(/\s+$/, ""), x: parts[0]?.x ?? 0, y: row.y, size: row.size };
        })
        .filter((l) => l.text.trim());
    }

    function isCJK(ch) {
      if (!ch) return false;
      const c = ch.codePointAt(0);
      return (c >= 0x2e80 && c <= 0x9fff) || (c >= 0xf900 && c <= 0xfaff) || (c >= 0xff00 && c <= 0xff60);
    }

    /**
     * 找出页眉页脚：在多数页面的**版面同一位置**反复出现的短行。
     *
     * 不能按「每页前两行 / 后两行」取候选——章节末页、插图页只有寥寥几行，
     * 正文会落进候选区，跨页一比对就被当成页眉删掉，直接丢内容。
     * 所以按 y 坐标判断是否落在页眉页脚带里，并跳过行数太少、信息不足的页面。
     *
     * 页码会变（1、2、3…），归一化成 # 之后再比对。
     *
     * @param {Line[][]} pages
     * @returns {Set<string>} 归一化后的特征串
     */
    function findRunningHeads(pages) {
      const total = pages.length;
      if (total < 4) return new Set();

      // 用全局 y 分布估计版心范围（多数页是满的，个别短页不影响分位数）
      const allY = pages.flat().map((l) => l.y);
      if (allY.length < 20) return new Set();
      const top = percentile(allY, 0.98);
      const bottom = percentile(allY, 0.02);
      const span = top - bottom;
      if (span <= 0) return new Set();
      const headZone = top - span * 0.08;     // 顶部 8%
      const footZone = bottom + span * 0.08;  // 底部 8%

      const count = new Map();
      let sampled = 0;
      for (const lines of pages) {
        // 行数太少的页面（章末、插图页）信息不足，拿来统计容易误伤正文
        if (lines.length < 5) continue;
        sampled += 1;
        const seen = new Set();
        for (const l of lines) {
          if (l.y < headZone && l.y > footZone) continue;   // 不在页眉页脚带里
          if (l.text.length > 40) continue;                  // 太长的不像页眉
          const key = normalizeHead(l.text);
          if (!key || seen.has(key)) continue;
          seen.add(key);
          count.set(key, (count.get(key) || 0) + 1);
        }
      }
      if (sampled < 4) return new Set();

      const out = new Set();
      for (const [key, n] of count) {
        if (n / sampled >= REPEAT_RATIO) out.add(key);
      }
      return out;
    }

    /** 页码归一化：把数字换成占位，这样「第 1 页」「第 2 页」算同一个 */
    function normalizeHead(text) {
      return String(text || "")
        .replace(/\d+/g, "#")
        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
    }

    /**
     * 行 -> 段落。
     * @param {Line[][]} pages  每页的行
     * @param {Set<string>} heads 要剔除的页眉页脚
     * @returns {{text: string, page: number}[]}
     */
    function linesToParagraphs(pages, heads) {
      // 正文行距的基准。
      // 不能用中位数：段间距、标题间距都会混进来把它抬高，
      // 一抬高阈值就没有任何换行能被判成新段落了。
      // 正文行距是出现最密集的那一档，取 30% 分位更贴近它。
      const gaps = [];
      for (const lines of pages) {
        for (let i = 1; i < lines.length; i++) {
          const g = lines[i - 1].y - lines[i].y;
          if (g > 0 && g < 200) gaps.push(g);
        }
      }
      const baseGap = percentile(gaps, 0.3) || 14;

      // 正文左边界：取所有行 x 的众数区间，用来识别缩进（缩进往往意味着新段落）
      const xs = pages.flat().map((l) => l.x);
      const baseX = percentile(xs, 0.2);

      /** @type {{text: string, page: number}[]} */
      const paras = [];
      let buf = "";
      let bufPage = 1;

      const flush = () => {
        const t = buf.replace(/\s+$/, "");
        if (t.trim()) paras.push({ text: t, page: bufPage });
        buf = "";
      };

      pages.forEach((lines, pi) => {
        const pageNo = pi + 1;
        let prev = null;

        for (const line of lines) {
          if (heads.has(normalizeHead(line.text))) continue;    // 页眉页脚
          if (/^[\s#·．.\-—]*$/.test(line.text)) continue;      // 纯装饰行

          let newPara = false;
          if (!prev) {
            // 每页第一行：跨页时通常是上一段的续行，除非有明显缩进
            newPara = buf === "" || line.x > baseX + line.size * 1.2;
          } else {
            const gap = prev.y - line.y;
            const indented = line.x > prev.x + line.size * 1.2;
            // 字号变了基本就是标题和正文的分界
            const sizeChanged = Math.abs(line.size - prev.size) > Math.max(prev.size, line.size) * 0.15;
            const prevEndsSentence = /[.。！？!?；;：:”"』」]$/.test(prev.text);
            const prevIsShort = prev.text.length < 30;
            newPara =
              gap > baseGap * PARA_GAP ||
              indented ||
              sizeChanged ||
              (prevEndsSentence && prevIsShort);
          }

          if (newPara) {
            flush();
            bufPage = pageNo;
          }
          buf = joinLine(buf, line.text);
          prev = line;
        }
      });
      flush();

      return paras;
    }

    /** 拼接续行：处理英文连字符换行，中文之间不加空格 */
    function joinLine(buf, next) {
      if (!buf) return next;
      const last = buf.slice(-1);
      const first = next[0] || "";

      // 英文单词被连字符断开：把连字符去掉直接接上
      if (/[A-Za-z]-$/.test(buf) && /^[a-z]/.test(next)) {
        return buf.slice(0, -1) + next;
      }
      // 中文之间不加空格
      if (isCJK(last) && isCJK(first)) return buf + next;
      if (/\s$/.test(buf) || /^\s/.test(next)) return buf + next;
      return `${buf} ${next}`;
    }

    function percentile(arr, p) {
      if (!arr.length) return 0;
      const a = [...arr].sort((x, y) => x - y);
      return a[Math.floor(a.length * p)];
    }

  return { itemsToLines, findRunningHeads, normalizeHead, linesToParagraphs, joinLine };
  },
  "src/sources/pdf/adapter.js": function (__require) {
    /**
     * PDF 的 BookAdapter。
     *
     * PDF 没有图片提取（渲染成 canvas 成本高、对「当代码读」也没意义），
     * 所以 blobUrlFor 恒空；内容以已经还原好的段落数组给出。
     */

    /**
     * @param {import("./load.js").PdfBook} book
     * @returns {import("../epub/adapter.js").BookAdapter}
     */
    function createPdfAdapter(book) {
      const byId = new Map(book.chapters.map((c) => [c.id, c]));

      return {
        kind: "pdf",
        meta: { title: book.title, author: book.author },
        chapters: book.chapters.map((c) => ({ href: c.id, title: c.title, depth: c.depth || 0 })),
        contentOf: (href) => {
          const ch = byId.get(href);
          return ch ? { paras: ch.paras.map((p) => p.text) } : null;
        },
        plainOf: (href) => (byId.get(href)?.paras || []).map((p) => p.text).join("\n"),
        blobUrlFor: () => "",
        coverUrl: () => "",
        info: () => [
          `pages: ${book.pages}`,
          `chapters: ${book.chapters.length}`,
          book.hasText ? "text layer: ok" : "text layer: 缺失（扫描版）",
        ],
      };
    }

  return { createPdfAdapter };
  }
